- genre_id: "10.05.01"
  name: "Jangle Pop/Dream Pop"
  year_emerged: 1985
  description: |
    By the end of the eighties, the power of Hard Rock or the spirit of Punk Rock seemed nowhere to be found. The majority of Rock had become electronic and commercialized (Synthpop). Many Generation X rock artists tried to stay away from the big record companies (the “Majors”) to prevent their music from succumbing to the same fate and turned to smaller, independent labels instead (the “Indies”), where they had the freedom to make what they liked: serious, downbeat rock with heavy, distorted guitar riffs, often dealing about emotional troubles or tragic thoughts. Many important indies (who later became majors) were part of this era: SST, Dischord, and Sire Records. Alternative Rock takes pride in an entirely self-made process through teamwork, college radio support, and peer collaborations. The music consciously partakes in the debate about music industry, with a strong stance against MTV, video clips, compact discs, and a stance pro vinyl and artistic graphic design. To strengthen and justify its own point of view, Indie Rock often uses objectified lyrics instead of a personal perspective.

    Early Alternative Rock music was primarily college radio music (thus for and by students), with jangly guitars and a minimal attention to rhythm. Therefore it became known as “Jangle Pop”. Closely related and heavily overlapping with college Jangle Pop was the Paisley Underground movement (named after the artists their retro psy paisley shirts) : a revival of 60s Psychedelic Rock in L.A. with a variety of Rock and Folk influences, fueled by a loathing escape from Glam Metal.

  artists: ["Pixies", "The Smiths", "R.E.M.", "Orange Juice", "The Replacements", "Camper Van Beethoven", "Live", "Dream Syndicate", "Green on Red", "The Rain Parade"]
  
- genre_id: "10.05.02"
  name: "Noise Rock"
  year_emerged: 1986
  description: |
    Noise Rock started much later than its predecessor No Wave (around 1986-’87) as a small but influential offshoot. In a way, the genre is a sort of missing link between Hardcore Punk and Alternative Rock. Inspired by not only Hardcore’s aggression but also its strict and drug-free lifestyle, Noise Rock deliberately turned its back on the excesses of the final Punk Rock movement. Noise Rock artists liked Punk Rock, but they were repulsed by what it had turned into. Idealism and revolution were replaced by nonchalance and chain tweaking. Based on Proto Punk Rock’s experimentation and No Wave’s nihilistic and destructive mentality, Noise Rock used that aversion to fuel songs of high-octane hate. Unsurprisingly, Noise Rock is extremely atonal/dissonant with massive guitar feedback. This just in case some milliseconds of the song would not be saturated with noise. Riffs are slower than Hardcore Punk, but faster than most Rock and often at low frequency. Singers scream angry lyrics on (or over) the top of their lungs that usually make no sense whatsoever or are highly offensive. The result is a serious contender for the most chaotic of all genres including Grindcore and Black Metal. Besides the US, Japan is a large distributor of Noise Rock (the country’s history of chaotic music is unparalleled worldwide). Noise Rock should not be confused with Noise Pop, which is related but very different and more similar to Dream Pop. Though small and unpopular, Noise Rock was a great influence on later music genres, such as Sludge (thanks to the Melvins) and Grunge.
  artists: ["Sonic Youth", "Helmet", "Butthole Surfers", "The Jesus Lizard", "The Melvins", "Pussy Galore", "The Boredoms", "No Trend", "Lightning Bolt"]

# - genre_id: "10.05.03"
#   name: "Dream Pop & Shoegaze"
#   year_emerged: 1988
#   description: |
#    From the mid-eighties till the early nineties a large psychedelic-alternative Rock scene blossomed out of the more obscure Paisley Underground movement. Just like the Paisley Underground, this Psychedelic Rock revival - known as Neo-Psy - was based on sixties’ jangly guitars and many sound effects. Around 1982-’83, Dream Pop branches off from Neo-Psy: a softer, more ambient version and in fact a kind of Proto-Post-Rock. Later, a part of Neo-Psy evolved into a new kind of “Acid Indie Rock”, called Shoegaze or Shoegazing, but sometimes Dream Pop and Shoegaze are used as interchangeable terms. Shoegaze is filled with layered, heavily distorted guitars (with feedback), washing over each other to create a spacy, atmospheric, textured sound, which is sometimes referred to as a “wall of noise”. Yet this music is (just like Stoner Rock) not really noise, just very droning, loud and psychedelic. The name Shoegaze was derived from the fact that some artists actually stared at their shoes while performing. Neo-Psy, including Dream Pop and Shoegaze, continues in the nineties, forming a parallel stream next to other Alternative Rock.
# 
#     In Manchester, an influential nightlife scene evolved around Shoegaze. This scene was dubbed “Madchester” or “Baggy” (because of the artists their baggy trousers), where Indie and Acid Rock played alongside (Acid) House, bridging two separate party worlds within sacred dance temples of drugs and ecstasy (such as the legendary Hacienda club). Madchester is a genre more defined by its geographical origin and its leading label Factory Records than anything else, but extremely entertaining nevertheless.
#   artists: ["The Cocteau Twins", "This Mortal Coil", "AR Kane", "My Bloody Valentine", "The Jesus & Mary Chain", "The Telescopes", "Curve", "Chapterhouse", "Slow Dive", "The Snake Corps", "Stone Roses", "Happy Mondays"]

- genre_id: "10.05.04"
  name: "Grunge"
  year_emerged: 1989
  description: |
    The focus on glamour and fashion in many eighties’ music formed the catalyst of a fierce anti-movement. Fierce may not exactly be the right word for it. Being the complete opposite of Glam Rock, this so-called “Grunge” (the name is negative slang for horrible noisy rock) was humble and inwards, with sincere songs about tragedy and frustrations. The sound on the other hand was dirty, distorted, lo-fi, vintage and crunchy as if it was composed by accident. Grunge often uses distortion on the amps, creating an even more abrasive sound. Grunge “fashion” reinforces such a notion of nonchalance: blue jeans, woolen lumberjack shirts, and dirty, sleazy long hair.

    Grunge’s brief but crowd-gathering music revolution started all in the cold and remote city of Seattle. Typical about the Seattle music scene in the eighties was a high popularity of Classic and Thrash Metal. When emotional Post-Hardcore bands pop up all across the states, the genre gets mixed with Metal and becomes Grunge (it is often said that Grunge is one part Metal one part Hardcore/Rock). Grunge is closely related to the second wave of Alternative Rock, which was an immediate result of it. Within the negative emotional context of Grunge and Alt Rock, resorting to heroin use is not uncommon, further adding to the tragedy. The success of Grunge lies in the strength of a return to the mutual core of Rock and Blues. Something that had been lost along the way: raw, unbridled emotion that seemed so hard to bear that it even distorted the music itself.
  match_instructions: "Music from later than the early 2000s should not go in this category"
  artists: ["Nirvana", "Pearl Jam", "Stone Temple Pilots", "Soundgarden", "Alice in Chains", "Green River", "Hole", "Screaming Trees", "Mother Love Bone", "Babes in Toyland"]

- genre_id: "10.05.05"
  name: "Rap Rock/Rapcore/Funk Metal"
  year_emerged: 1990
  description: |
    The combination of Rock and Rap found its origin in the eighties, with the desire of Run DMC’s producers to reach a bigger audience and restyle Aerosmith’s “Walk This Way” into a Rap Song. But at the start of the nineties, a real genre emerges: Hard Alternative, Rap Rock, Rapcore, or Funk Metal. Strictly speaking, these are all different genres but so closely related, it’s pointless to separate them. In short, they are heavier, faster types of Alternative Rock, with strong influences from (classic East Coast) Rap music, sharing the same ferocity and anti-commercial mindset. One must not forget after all, that Rap was still “fresh” in 1990 (especially in Europe) even though it was already sixteen years old. As a result, artists were eager to infuse Rap in contrasting genres such as Acid House and Hardcore/Alt Rock.

    The lyrics are fast, in a raplike way (or even true raps), and the music is more rhythmical than other types of Rock. Both Rock and Rap artists crossed over to each other’s side, but unfortunately the genre didn’t break through in mainstream charts. Even the conceptual “Judgement Day” soundtrack - an experiment of teaming up harder Rock bands with aggressive Rap bands – failed to meet the (high) sale expectations.

    Sometimes Rap Rock crosses over into anything remotely raplike, such as Funk (called Funk Metal, though it is barely Metal at all), Breakbeat, or even Reggae/Ragga. Rapcore (Hardcore + Rap) gradually became harder, more experimental and mixed with Metal, evolving into Nu-Metal or Rap Metal.
  artists: ["Rage Against the Machine", "Kid Rock", "Faith No More", "Dog Eat Dog", "Red Hot Chili Peppers", "Bloodhound Gang", "Clawfinger", "Urban Dance Squad", "Biohazard & Onyx"]


# - genre_id: "10.05.07"
#   name: "Math Rock & Mathcore"
#   year_emerged: 1992
#   description: |
#     If there would be such a thing as “Intelligent Rock Music” or “IRM”, it would probably be Math Rock. Pioneering artists can be traced back as early as 1988, but Math Rock takes its mature form after the emergence of Post Rock. Its name is derived from experimenting with asymmetrical complex time signatures that give a jagged and chaotic sound. These experiments are so technical and far-reaching, that “mathemical” is a proper way to describe them. Particularly the pronounced drum rhythms (with breaks and interrupts) are treated this way. Drums take lead over voice, which becomes (along with the lyrics) less important.
# 
#     Math Rock and Mathcore obviously have a common “mathematical” dimension, but they are very different genres. In 1993, the first traces of Mathcore appear; a forerunner of the later Metalcore. Because Mathcore evolved alongside Metalcore and eventually becomes a subgenre of it, the difference between Mathcore and Math Metal is minimal. In fact, it wasn’t until 1999 (after Metalcore) that the phrase Mathcore was coined. Before that, it was known as the loosely defined Noisecore. Mathcore combines the speed and energy of Hardcore and Metal with the complexity and non-structure of Jazz and unconventional Classical Music.
#   artists: ["Don Caballero", "A Minor Forest", "Hella", "Battles", "Shellac", "Drive Like Jehu", "The Dillinger Escape Plan", "Deadguy", "Botch", "Converge", "Angine de Poitrine"]

# - genre_id: "10.05.08"
#   name: "Alternative/Indie Rock II"
#   year_emerged: 1993
#   description: |
#     Alternative Rock is almost never divided into two distinct genres, but just like Dubstep and Nu R&B, it should be. After the big Grunge revolution, Indie Rock experienced a metamorphosis and splintered in many subgenres, which were all a response to Grunge in one way (positive) or another (negative).
# 
#     Many Indie Rock artists changed the genre into a darker, heavier version of itself, with more desperate tragedy and angry frustration in its lyrics. It also lost some of its Hardcore and DIY influences, with songs becoming longer, more complex and better produced. The second wave of Alternative Rock was no longer truly alternative, and their artists less and less a part of independent record labels. Some Alternative Rock bands even became bestselling stars, filling Rock festivals (also in an after-Grunge state of booming) for decades to come. With so many spotlights on Alt Rock, a tremendous opportunity unveiled itself for the innumerable amount of independent female front artists to tilt Rock music from a macho, male-dominated bastion into what appeared as gender equality: arguably the biggest emancipation wave in music history. Some women went further and created a Punk-influenced feminist subgenre, known as Riot Grrrl.
# 
#     But instead of building further on Grunge’s legacy, a number of alternative subgenres reacted against it. There was too much stardom and too much focus from majors on Grunge and Alternative Rock. Kurt Cobain’s suicide (frontman of Nirvana) in 1994 was an immediate and cataclysmic consequence of this, which rocked the entire world of popular music to its foundation. Two underground subgenres emerged: the heavily under-produced Lo-Fi (Rock) and the minimal Slo(w)core aka Sadcore. Lo-Fi is primarily defined by its low-fidelity sound, which can take on extreme forms (imagine a cassette tape that is nearing the end of its lifecycle) to ensure a total rencouncement of mainstream attendance. Slowcore is a very important subgenre (and still popular) that is deliberately the opposite of Grunge: gentle and slow, placid, and filled with tender, fragile sounds.
#   artists: ["Smashing Pumpkins", "Garbage", "PJ Harvey", "Skunk Anansie", "Cranberries", "L7", "Bikini Kill", "Bratmobile", "Low", "Codeine", "Tall Dwarfs", "Daniel Johnston"]
  
- genre_id: "10.05.09"
  name: "Britpop"
  year_emerged: 1994
  description: |
    If every reaction has a “re-reaction”, then Britpop is the re-reaction to Grunge (since Grunge was a reaction itself against Glam Metal). Enough with all the feeble, depressing sorrow and back to glamorous Rock! This soft but catchy kind of Pop is sometimes credited as the least original genre of the nineties. On an auditory level there is indeed not much shocking: a clear wink to British (of course) Mersey Beat but roughened up by the presence of Indie Rock, with sometimes synthesizers and electronic effects to cast a certain glam mood. What makes the genre so well-known, popular and clearly defined is not its sound then, but the Rock ‘n’ Roll mentality of it: the cocky attitude of British frontmen determined to conquer the stage, steal the show and awe the masses. There is a reason for such attitude: many British bands were fed up with the overall dominance of American Rock bands in the British hit charts of the early nineties (mostly due to Grunge). As such they created a strong anti-American music genre, with a very narrow range of influences (all British). Of course, the sound, vocals and song structure are all means to this end. Which explains why Britpop is same meat, different gravy, but very attractive.
  artists: ["Oasis", "Blur", "Pulp", "Suede", "Elastica", "Supergrass", "Cast", "Mansun", "Dodgy", "Ocean Color Scene"]

- genre_id: "10.05.10"
  name: "Post-Grunge Alt Rock"
  year_emerged: 1995
  description: |
    In the mid-nineties Grunge was barely a shadow of its former self. Its demise had not been in vain however. Many new Rock bands filled the hole that Grunge left and were especially influenced by its tragic, introspective, sentimental lyrics. Post-Grunge elaborated further on this theme but also took a step away from Grunge’s heavy distortion, chaos and roughness. The result was a slicker, more polished sound with a clear song structure that turned out to be a commercial success. Post-Grunge became so popular that it stayed in the mainstream much longer than other “Alternative” Rock (though no surprise as its newest genre), against the will of various opponents. These antagonists claimed that Post-Grunge was merely a commercial imitation of something genious and that it should be clearly separated from the original (leading to its name). On the other hand, the fans saw it as the culmination of Rock where finally a perfect balance of roughness versus slickness was found.
  artists: ["Foo Fighters", "Creed", "3 Doors Down", "Green Day", "Nickelback", "The Sheila Divine", "HIM", "Stained", "Bush"]
  
- genre_id: "10.05.11"
  name: "Contemporary Southern Rock"
  description: |
    There's a modern group of artists who mix the sensabilities of Contemporary Alt/Garage Rock with aspects of Classic Southern Rock.
  artists: ["Kings of Leon", "Alabama Shakes", "The Weeks", "Edwin Sharpe and the Magnetic Zeros"]

  
# - genre_id: "10.05.11"
#   name: "Post-Rock"
#   year_emerged: 1995
#   description: |
#     The final chapter in Alternative Rock is the quest for a new sound, a new direction for Rock music in general. Something beyond what was already done, whether it was indie or mainstream. The result of this “Post-Rock” was indeed drastically different; one can easily recognize the spaced out, ambient sound. Post-Rock revolted against both the self-indulgent attitude of alternative rock bands, more concerned with coolness than sound and the greedy commercial bands, composing whatever sells best.
# 
#     The songs are almost hypnotic, taking the listener on a musical voyage. Of course the synthesizer is a key instrument of Post-Rock, especially to create droning sounds, while drums and (only) the gentle bass guitar form a steady background structure. Post-Rock lacks a classic song structure (verse-chorus) to create surprising music and likes to implement unusual techniques on traditional Rock instruments. There are guitars, drums, and bass but one would hardly recognize them in a familiar Rock way. Post-Rock might have been called Ambient Pop, being very soft with hardly any riffs or noticeable guitars, but that would do the experimental nature of the genre inadequate justice.
#   artists: ["Air", "Sigur Rós", "Mogwai", "Explosions in the Sky", "Cul De Sac", "Turtoise", "Godspeed You! Black Emperor", "Labradford", "Do Make Say Think", "65daysofstatic"]

- genre_id: "10.05.12"
  name: "Jam Bands"
  year_emerged: 
  description: |
    Artists known especially for long, live sets, improvisation, and shows that vary widly from day to day.
  artists: ["Dave Matthews Band", "O.A.R.", "Widespread Panic", "Phish"]


# - genre_id: "10.06"
#   name: "Contemporary Rock"
#   year_emerged: 
#   description: |
#     For the lack of a proper name, “Contemporary” Rock signifies all new Rock genres in the 21st century. Although this may sound like a meaningless term for the sake of creating a false portmanteau, Contemporary Rock genres share common characteristics, though not technical ones. Generally speaking, two dominant forces control and shape the rise of these genres (and not only in the world of Rock music): recycling and eclecticism. Cut-and-paste techniques form new genres out of old ones. Choice is power and originality/experimentation is overrated. Rock bands focus on the quality of their music and the search of a personal sound, instead of desperately christening a new crusade in the form of genre. The great boom of music genres in the nineties (not only EDM, but also Indie) must undoubtedly have led to genre fatigue and escapism in unclassifiable sound, of which “contra-genres” such as Witch House are the physical proof. Indeed, one might argue that in the 21st century, genre has become alternative or obscure, and fusion has become mainstream.
# 
#     A technical definition of Contemporary Rock is lacking. The genre uses different influences to create a new concept of Rock music. Synthesizers – once revolutionary and exciting – have become an ordinary Rock instrument like guitar or drums. With influences from Pop, Electronic and even Folk, anything is possible. One could say that Contemporary Rock is defined by being any kind of Rock different from the past. But not even this is true, as Garage Rock and Post-Punk revivals form the exception to that rule.
# 
#     The power of Contemporary Rock lies in reaching out and building bridges towards other music genres. The age of subcultural niches (us against them) has ceased. The era of genre competition has faded. The ambiguous non-genre “Mash-Up” is a striking example of this; Mash-Up combines all kinds of genres into an eclectic mix, full of surprises and a deliberate mashing of unrelated styles.
# 
#     Around 1999-2002, Dance becomes more popular than (Alternative) Rock, instilling fear in the hearts of many Rock enthusiast. Yet at the beginning of the millennium (around 2003-2004), Contemporary Rock proved powerful enough to push Dance music back underground. Today the genre remains a powerhouse among popular music, although Contemporary Rock and the arrival of ever more music streaming apps and websites already hint that in the future there will be no more genre monopoly, but a rather equal spread of popularity among all genres, whichever ones that may be.
# 
#     It is at the very least striking to see that in a society with abundant injustice (financial crisis, climate change, terrorism, racism and migration problems, energy crisis, growing income gap,…), new protest music genres embedded in reactionary subcultures fail to emerge. This may only be explained through the even larger impact on artists of countering forces in contemporary society: globalization, mass-communication, secularisation, techno-materialism, capsulation, and isolation. But Rock must not take the fall for these contemporary behavioural patterns. All super-genres struggle to bring purist styles to the table and to maintain the confined identity they once had. However, if there is one thing Contemporary Rock and consorts such as Mash-Up can teach us, is that we should regard all popular music as one big, indestructible family instead of a list of groups: an intricate network of nodes – a constellation of sound.
 # 
#   artists: 
# 
# - genre_id: "10.06.01"
#   name: "Post-Britpop"
#   year_emerged: 1999
#   description: |
#     Despite the aversion of relevant bands to the label “Post-Britpop” and claims that genre fragmentation within Britpop is pointless, this style is a lot more defined than what you would expect. Britpop’s patriotism got in the way of experimentation and American or Indie influences. Yet a second wave of British artists in the late nineties valued these merits higher than cultural preservation. A clear distinction with their predecessors is the rejection of guitar as the dominant instrument, in favor of a more electronically oriented sound. Another key alteration is the absence of Britpop’s cocky attitude, which got replaced by highly sensitive, fragile lyrics. Post-Britpop is symbolized by a loss of ego. Avant-garde bands like Radiohead and The Verve spearheaded this transition in their later works, but were only a vague sign of things to come. The popularity of Post-Britpop bands quickly outgrew traditional Britpop, making Post-Britpop a sort of Stadium Rock of the nillies. A number of bands returned to the original sound of Britpop, but with contemporary Rock influences such as The Kaiser Chiefs or Bloc Party. With success comes envy and Post-Britpop songs eventually became accused of sounding too uniform, sterile and predictable. Coupled with whiter-than-white sound production and high-pitched male vocals, the way was paved for a countering return to sleazy, lo-fi Garage Rock.
#   artists: ["Coldplay", "Muse", "Stereophonics", "Travis", "Feeder", "Doves", "Snow Patrol", "Keane", "Kaiser Chiefs", "Bloc Party"]
#   
# - genre_id: "10.06.02"
#   name: "Emo Rock"
#   year_emerged: 1999
#   description: |
#     Around 1996, the earliest crossovers between Emocore and (Alternative) Rock start to take hold. By drifting further away from Hardcore towards Rock, a broader audience could be reached. However, Emo Rock bears little resemblance to its predecessor Emocore: the genre is more a sentimental and emotional form of Indie Rock than an alternative version of Emo. The first wave of Emo bands delivered open-hearted lyrics and compelling power chords in a jacket of heavy distortion riffs.
# 
#     By 1999 the genre takes a big leap forward, as major record labels realize the potential while opportunistic bands arise, which use the stereotypical image of “Emo” to sell their music to teens. Emo becomes a marketing tool, complete with the fashion of tight jeans, heavy make-up, black & white clothes and purple dye. With far more politically correct lyrics than the first wave of Emo Rock bands, the mainstream appeal of Emo becomes so large that after 2001 a brief but intense emo hype takes hold. By now the term “Emo” has become familiar to the general public and a well established teenage subculture. Unsurprisingly, the genre was heavily frowned upon by a more mature or old skool crowd, due to the lack of early Emo “edginess” and the presence of a rather superficial sentimentality.
#   artists: ["Placebo", "My Chemical Romance", "Sunny Day Real Estate", "Jimmy Eat World", "Fall Out Boy", "Paramore", "Tokyo Hotel", "The All-American Rejects", "Evanescence", "The Rasmus"]
# 
# 
# - genre_id: "10.06.03"
#   name: "Garage Rock & Post-Punk Revivals"
#   year_emerged: 2003
#   description: |
#     The start of the new millennium purveyed an ominous future for Rock music. Alternative Rock was far past its peak and all that remained was Post-Rock and Post-Britpop. Although these genres certainly have their merit, they marked a clear step away from the traditional definition of Rock music: too polished, overproduced and too eclectic. Saturation of music genres became visible in the new millennium, dubbed “the age of eclecticism and recycling”. Whether it was fear for Rock’s future or an aversion for Post-genres, eclecticism was not an option for certain bands. Thus they chose recycling and in an unusual way. Both Garage Rock and Post-Punk were held in high esteem as “pure and rough Rock genres”, leading to Garage and Post-Punk revivals. Although these genres are clearly different, influences from both Shoegazing and Alternative Rock and further cross-influence made their revivals almost impossible to separate. Hence they are conjoined under the name “Nu-Rawk”. The choice of reviving said old genres by new standards worked better than expected and now Nu-Rawk can be seen as the genre that revitalized Rock in the new millennium. Its moment of fame was shortlived however, except a small number of bands with continuous popularity who rose to great fame. As always in music history, shortly after the pendulum swung the other way and Nu-Rawk changed into the eclectic Dance Punk.
#   
#   artists: ["The White Stripes", "The Strokes", "The Black Keys", "The Hives", "The Vines", "The Libertines", "Arctic Monkeys", "The Dirtbombs", "Interpol", "Editors", "Black Rebel Motorcycle Club"]

  

# - genre_id: "10.06.05"
#   name: "Indietronica & Chillwave"
#   year_emerged: 2005
#   description: |
#     Long after the Madchester explosion (and the fall), Shoegaze was rediscovered as a perfect ingredient for a remarkable melting pot: Synthpop, Electronica, and Shoegazing went pretty well together in a new type of “Ambient New Wave Indie Rock” that could either be called Nu-Gaze, Indietronica or Chillwave depending on matter of perspective or whether the core structure of a certain song is either Rock (New (Shoe)Gaze), Pop/Wave (Chillwave) or Downtempo (Indie (elec)tronica). Therefore two different songs belonging to this genre can very well sound rather different. Unsurprisingly, this is a fairly broad and flexible genre, which can easily tap into a wide spectrum of related genres. Where Nu-Gaze is rather an obscure and rare genre and Indietronica too loosely defined, Chillwave is the genre that comes closest to a certain definition. A definition that easily swallows the other genres as well (illustrated by Chillwave’s alias: Downtempo Pop). After all, this is the age of eclecticism. Chillwave has a very summery mood, full of optimism and dreamy Pop vocals. Eighties retro (further enhanced in a dark way by the successor Synthwave) and lots of reverb on different song parts make it seem like Dream Pop is back from the dead. Another synonym, “Glo-Fi”, also points out parallels between Chillwave and the Dream Pop/Shoegaze era.
# 
#     A term frequently associated with these latest Rock genres (but obviously applicable to others as well), is “Laptronica”: electronic music performed entirely by simply a laptop. But Laptronica qualifies rather as a derogatory slur from Rock bands and journalists who favor a classic instrumentation (even though Indietronica and exponents often do have one).
# 
#   artists: ["Roÿksopp", "Years & Years", "Stereolab", "Chromatics", "Cherub", "Thom Yorke", "The Postal Service", "Herman & Kline", "The Notwist", "Post War Years"]
#   
# 
#   
# - genre_id: "10.06.07"
#   name: "Dance-Punk & Nu Rave"
#   year_emerged: 2006
#   description: |
#     The first notion of the word Dance-Punk appeared around the late seventies as a crossover of Post-Punk into Disco. Though Punk has always been a hyperkinetic genre tied to dancing, “Disco-Punk” reaches out to electronic beats to strengthen this bond.
# 
#     After Post-Punk, a number of New Wave and Shoegazing bands also experimented with the idea of electronic pulsating rhythms, more similar to EDM than Synthpop (New Order’s avant-garde “Blue Monday” for example). Especially in Manchester, UK, cross-pollination was at an all-time high: Acid House was welcomed by the British with open arms, leading to an unusual subgenre called Madchester, the bridging between Alternative Rock and Acid House.
# 
#     Alternative Dance or Indie Dance (or “Punkfunk”) is the combination of any Alternative or Punk/Wave genre with Dance music, including many Madchester songs and early Dance-Punk. As such, the genre is poorly defined and more a collection of unrelated songs dispersed as dying stars in the musical universe. However, the renewed interest in pre-Indie Rock music by Nu-Rawk bands also shifted the ground where Indie Dance was buried, resulting in what is now understood as “Dance-Punk”: modern Punk/Wave meets House. The music is so infectious that even the middle aged middle class white man starts to dance.
# 
#     And finally, there is the short-lived New (Nu) Rave movement, which blends Dance-Punk with Indie Rock. Fast, danceable Rock music created by artists with only their laptop: DIY entrepreneurship like free Tekno and Rave and a grasp of their old skool euphoria in a Rock ensemble. Nu Rave is Madchester in the age of social media and hipsterism.
# 
#   artists: ["LCD Soundsystem", "Soulwax", "Yeah Yeah Yeahs", "!!!", "The Rapture", "The Infidels", "Klaxons", "New Young Pony Club", "Shitdisco", "Trash Fashion"]
#   
- genre_id: "10.05.13"
  name: "Folk Rock/Alt Country"
  year_emerged: 2008
  description: |
    Although this genre is obviously a form of Folk music, a large and welcoming familiarity within Rock/Pop circles combined with a heavy influence from popular music justifies its presence on the map. In fact, Freakfolk is so eclectic that it cannot belong to only one super-genre and is sometimes called Free Folk. As a subgenre of Indie Folk (which is any combination of Alternative/Contemporary Rock and Folk) it started off rather slowly around 2003. Psychedelic Folk Rock Bands such as The Incredible String Band, Holy Modal Rounders and Comus inspired diverse artists into a new, hypnotic and druggy kind of Folk. Modal based structure (like Modal Jazz) and multi-layering of freaky sounds with the most unusual instruments are the primary contributors to its experimental nature. It’s hard to put a common denominator on Freakfolk’s sound, which is exactly why it’s called that way or by its synonym: New Weird America.

    Indie Folk's history can be traced back to the nineties, when Alternative Rock bands revive Folk once more. But it wasn’t until the arrival of certain promiscuous Electropop singles and later Moombahton and derivatives that both Indie Folk and Freakfolk really build up momentum. This youth-oriented, twerk-friendly, hyperactive and formulaic music pushed Freakfolk and Indie Folk even more in the opposite direction, and created an incentive for more mature, honorable and unpredictable music. The latest forms of Indie Folk (which have become highly popular, like e.g. Mumford & Sons) are also known as Nu-Folk.

  artists: ["Fleet Foxes", "Mumford & Sons", "Bear's Den", "First Aid Kit", "CocoRosie", "Grizzly Bear", "Devendra Banhart", "Joanna Newson", "Charalambides"]  
  
