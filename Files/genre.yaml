  name: "Contemporary Blues Rock"
  year_emerged: 2008
  description: |
    
  artists: ["Gary Clark Jr", "The Black Keys"] 


- genre_id: "10.05.15"
  name: "New Progressive and Math Rock"
  year_emerged: 2005
  description: |
    Progressive Rock is a large and durable family of music often divided into several subgenres. One of these for example, is Neo-Prog(ressive Rock). During the eighties, a second wave of artists further experimented with modern technology and often into more symphonic or classical directions. Though over the course of time, Progressive Rock lost that edge over other genres as eclecticism, electronic influences and experimentation in general became more and more basic tools of any Rock band in order to bring something new and exciting to the table. Only a select number of bands could attain the label “Progressive”.

    Several decades after Neo-Prog’s creation, New Prog arrives (also labeled Post-Prog or Nu Prog). In a way, New Prog(ressive) is like Prog Metal: a means to classify recent Rock bands that are hard to categorize, but who share a love for original Progressive Rock while staying underground. From the mid nillies onwards, there has been a rise in eclectic bands with a natural talent towards experimentation and high contrast unfrequently used in other genres. This Post-Prog wave differs from the original Prog Rock by an affinity for newer, heavier genres (especially the sharp ones, such as Punk, Hardcore, and Speed Metal). This makes Nu Prog no more eclectic than other Contemporary Rock genres such as Dance-Punk or Chillwave, but it places it at the other side of the spectrum: away from Pop and House. What we have here then is a sort of Post Rock-meets-Metalcore genre; a crisp and clean combination of soft and hard song parts that naturally can cross over to Math Rock.
  
  artists: ["Porcupine Tree", "The Mars Volta", "Menomena", "Kayo Dot", "Ozric Tentacles", "Mystery Jets", "Ahleuchatistas", "Good Tiger", "Coheed & Cambria", "Thee Oh Sees", "King Gizard and the Lizard Wizard"]
  
  
    
- genre_id: "11"
  name: "Metal"
  description: |
    Although for most people Heavy Metal is (correctly) a harder and faster type of Rock, the genre is actually a continuation of “the Devil’s music”: Blues. After Metal’s experimental phase during the seventies (read more at Classic Metal), it lost a lot of its Blues influences and evolved rapidly into a variety of different styles. Two aspects of Blues have always remained however: lyrics about sorrow, nihilism, pain, tragedy, and a more concealed subtext revolving the Devil (though for Blues this was more a reputation than an actual theme). Heavy Metal expanded on these aspects in an obsessive manner. Death, destruction, corpses, zombies, Satan, pentagrams, evil themes, lots of black, torture, sharp and gothic artwork, and a hand symbol that both resembles the Devil’s horns and the letter “M”. These are the main elements of stereotypical Metal artwork/culture that have become so dominant that anything else is almost an exception to the rule. The visual language of Metal – a symbolism of anything dark or evil – transcends into corresponding fashion: black T-shirts with Metal artwork, black leather, wristbands with sharp pins, long sleazy hair, black jeans and of course: metal.

    The term “Heavy Metal” describes well the two cornerstone aspects of the genre. It is heavy due to more amplification and distortion than Rock and it is also very “metallic”, meaning technical/rational. Heavy Metal is an overcharged engineer among genres, with highly technical unique elements such as blast beats, double bass drums, 12 string bass, lightning guitar solos and difficult voice techniques (grunting, falsetto, opera, screeching, etc.). Heavy Metal songs are usually longer than Rock songs, with more elaborate and diverse song structures. Without a radio friendly format, Metal has stayed clear from mainstream attention, although the genre is internationally well-known and connects fans across the most diverse of countries. Riffs are even more important than in Rock, and form the foundation around which many Metal songs are built. Many Metal riffs, especially early ones, make use of the Tritone: a musical dissonant interval of three whole tones that conveys a sense of restlessness. As such, the Tritone used to be associated with the Devil (Tritonus Diabolus in Musica Est) since the 18th century. What makes Metal appealing as well is a strong tendency for the theatrical. Metal likes to be bombastic to fortify its message (often of doom or evil), whether by classical elements, synth elements, more instrumentation, instrumental intermezzos, or elaborate intros.

    “Heavy Metal” as a phrase can be traced back to Steppenwolf’s famous Hard Rock single “Born to be Wild”, in which the line “Heavy Metal Thunder” is mentioned: a quote from William S. Burrough’s book “Naked Lunch”. After all, Heavy Metal and Hard Rock were more or less the same in the early stages of the genre.

    Heavy Metal is extremely popular within nerd culture. This is no coincidence: Metal is music for the analytical mind; it does not simply present itself but challenges the listener to carefully dissect the overload of mid- and low-frequency aural information. In order to absorb all of the music, Metal urges to re-listen at high volume. Because nerd culture has taken an interest in Metal, it has become one of the most defined, examined and structured super-genres, with a strong hierarchical genealogy and copious (over 50) subgenres, sometimes bordering on the ludicrous. Christian Black Metal, Pirate Metal and Viking Metal are such examples. It is only a matter of time before Ninja Metal gets invented, but until then, there is already plenty to explore within one of the healthiest super-genres and with one of the most loyal fan bases. Metal has considerable overlapping with Hardcore Punk, as both genres share a love for speed and heavy guitar music. Grunge is sometimes regarded as a part of Metal as well, but this has led to a backlash of German Metal fans, who swear only by so called “True Metal”: Metal without Grunge or other crossovers.

    Although Metal culture is (just like Hardcore Punk) largely drug-free, the average alcohol consumption tends to be much higher than within any other music culture and certain genres (Folk Metal or Viking Metal) are conceived as the perfect music to be very, very drunk to. Combined with the special Metal “dance” of head-banging, Metal is far from an introvert genre – it’s meant to bring down the house.

- genre_id: "11.01"
  name: "Classic Metal"
  year_emerged: 1970
  description: |
    Heavy Metal used to be an interchangeable term with Hard Rock in the late sixties. The earliest examples of the genre - Classic (Heavy) Metal - are often cited as Hard Rock examples and vice versa. As such, Classic Metal is a loosely defined genre: simply “Harder-than-Hard Rock”, mainly by means of more amplification and distortion. However, two British bands marked a turning point after which the schism with Rock was a fact: Black Sabbath and Led Zeppelin.

    The shocking tragedy of four deaths and excessive violence at the Altamont Festival in 1969 marked the end of the flower power age, a temporary exile of the Rolling Stones and most importantly: a loss of belief in the hippy utopia. Rock couldn’t make the world a better place and everyone had witnessed the dark side of human nature: deep down inside man is evil. The first band to be influenced by this event was Led Zeppelin. Described at the time as Rock music being dark, heavy and gloomy, it was almost impossible to listen to. Black Sabbath developed an even slower, tuned-down sound, yet also full of distortion, with thick and heavy riffs. In their later work they also experimented with tempo and different instrumentation. Both bands feature lengthy songs, with elaborate guitar solos, while often referring to satanic or dark themes.

    These early blueprints inspired Blues Rock and Acid Rock artists into a similar sound and style, yet over the course of time Blues influences became replaced by a pure metallic sound.
  
  artists: ["Black Sabbath", "Led Zeppelin", "Deep Purple", "Judas Priest", "Budgie", "Blue Öyster Cult", "UFO", "Uriah Heep", "Mountain", "Blue Cheer"] 

- genre_id: "11.02"
  name: "Progressive Metal"
  year_emerged: 1974
  description: |
    A few Heavy Metal bands (eventually more and more) could not be classified within any existing genre. The metal community, more obsessed with genres and classification than any other music community, came up with progressive metal or Prog Metal. Yet it would be too easy to discard Progressive Metal as a residual non-genre. In the footsteps of Progressive Rock, Prog Metal bands experiment with long, elaborately structured songs and adding classical or exotic elements. They thrive to make Metal sound more intense, crisp and clean, yet unpredictable and non-formal. By doing so, Prog Metal also sounds somewhat less heavy and thus gained less appeal. Most Progressive Metal uses more sound layers or tracks than other Metal genres, accompanied by a steady rhythm. Prog Metal sounds like the delicate middle ground between Power Metal, Gothic Metal, and Thrash Metal. In this quest for metallic perfection, only a tiny handful of bands became known. The others remained shrouded in obscurity that they probably embraced.

    In recent years, Math Metal has given birth to one of the newest and most peculiar of Progressive Metal subgenres: Djent. Djent is a Swedish Prog Metal subgenre based around a special technique of guitar strokes that sound like the word “Djent”. The term Prog Metal became also somewhat outdated in the 21st century, and thus the latest wave of experimental Metal artists became known as Post-Metal.
  
  artists: ["Tool", "Dream Theater", "Queensrÿche", "Fates Warning", "Meshuggah", "Symphony X", "Pain of Salvation", "Threshold", "Evergrey"]     

- genre_id: "11.03"
  name: "Power Metal"
  year_emerged: 1977
  description: |
    Power Metal is a lesser known but properly defined kind of Heavy Metal that started in the seventies (particularly in Germany) and still has a dedicated fanbase today. Power Metal is not really heavy; first and foremost it’s high and fast. The lyrics often tell fictional fantasy tales about warriors, knights, dragons and whatnot and are almost always sung in a high pitched male voice. Furthermore the music is filled with melodies and drum rolls, building up and breaking down, like a rollercoaster ride filled with energy and enthusiasm. The difference between the speedy and guitar solo-oriented types of Classic Metal (of which Power Metal evolved, like e.g. early Van Halen) and Power Metal is that the latter seems to constantly maintain its high velocity and even higher frequency, as if it’s being overcharged with electricity. Power Metal is a genre that never really influenced other genres or evolved in another one. As such it remained a long-lasting parallel Metal stream, though easily eclipsed by the bigger Metal genres.
  
  artists: ["Blind Guardian", "Hammerfall", "Halloween", "Savatage", "Metal Church", "Manowar", "Gamma Ray", "Dragonforce", "Kamelot", "Iced Earth"]

- genre_id: "11.04"
  name: "Glam Metal/Hair Metal/Pop Metal"
  year_emerged: 1977
  description: |
    By the end of the seventies, the concept of Glam Rock got transferred to the world of Metal. Glam Metal went a few steps further though. Where Glam Rock tried to be mysterious and excentric, Glam Metal embraced the medium of television like a window for voyeurs. Long haired male bands (nothing new, but was a first for TV, hence the name Hair Metal) made commercial Metal songs with poplike feelgood tunes, to guarantee themselves some air time. Glam Metal was one of the few music genres that got played a lot during the first years of MTV, which further expanded the fame of these artists. Unfortunately this air (and concert) time was not used to promote the music but rather the private parts of the band. More often than not, Glam or Pop Metal is about sex or at the very least about macho and hedonistic themes. Initial protest was minimal though, as it was hard to take a band in black leather and excessive make-up seriously, plus it didn’t hurt the ratings either. Almost all famous Glam Metal bands were based in Los Angeles, where a glam subculture of stardom allures promiscuity and heroin abuse, paving the surface of Sunset Boulevard.  
  artists: ["Guns 'n' Roses", "Kiss", "Alice Cooper", "The Scorpions", "Poison", "W.A.S.P.", "Twisted Sister", "Def Leppard", "Van Halen", "Mötley Crue"]
  
- genre_id: "11.05"
  name: "New Wave of British Heavy Metal"
  year_emerged: 1979
  description: |
    When Heavy Metal was picked up in the UK, a lot of young bands were eager to make raw, energetic, revolutionary music on their own. On the one hand driven by a contempt for the popularity of Glam/Pop Metal’s commercialism, on the other hand by an urge to keep the British Punk legacy alive. These young bands gathered in garages and quickly formed a massive counterreaction to Glam Metal. By being (a lot) faster, louder, and tougher and with lyrics becoming more pessimistic and aggressive, they transformed Classic Metal into the New Wave of British Heavy Metal (NWOBHM) (although “Garage Metal” would also be a more suitable and descriptive name). The NWOBHM reinvented earlier Classic Metal and Hard Rock bands into a more metallic and edgier sound, and hereby shaping Heavy Metal into the characteristic sound it is most affiliated with. British Metal musicians molded Heavy Metal into the genre most people know, by showing off with bullet-speed riffs, screaming solos, and high-pitched vocals (though still lower than Power Metal).

    After its arrival on US soil, the NWOBHM changed into Thrash Metal, while many UK based bands kept performing and stayed more or less true to their sound. The NWOBHM was a lot more swinging and sometimes even “poppy”, compared to later Thrash Metal.

  artists: ["Iron Maiden", "Motörhead", "Diamond Head", "Angel Witch", "Saxon", "Girlschool", "Blitzkrieg", "Praying Mantis", "Raven", "Tygers of Pan Tang"]
  
- genre_id: "11.06"
  name: "Thrash Metal"
  year_emerged: 1982
  description: |
    What the NWOBHM did to Classic Metal, Thrash Metal did to the NWOBHM. American bands became hugely influenced by their British predecessors and decided to take it up another notch: the music became even faster and more drum and bass heavy (often involving a drum kit with two bass drums). Glam/Pop Metal made Metal too commercial and lighthearted. Thrash Metal was the answer. Besides aggressive, low-frequency riffs (which are sometimes fittingly described as “shredding”), hyperactive scales and arpeggios and prominent thrashing drum work are the most recognizable features of Thrash Metal. The overall song length also increases compared to NWOBHM, adding more complex song structures to the music. The genre quickly stood out amongst other Metal styles and soon a number of bands rose to international fame, known as the “Big Four of Thrash Metal”. These Bands - Metallica, Slayer, Megadeth, and Anthrax - helped spread Metal throughout the globe, from Japan to Brazil. Thrash Metal also displays a less friendly form of lyrical content. With nihilistic lyrics, often about anti-establishment, justice or war, Metal bands use just about anything to enforce a theatrical vocabulary. But like almost all Heavy Metal the message is rather cryptic than truly political. By the nineties, Thrash Metal’s popularity faded and a new subgenre “Groove Metal” (aka Groove Rock) came in to light. Groove Metal or Rock focused more on a rhythmic groove than simply bass. Yet Thrash Metal is still among the most widely known Metal genres and like any golden age, never truly dead.
    
  artists: ["Metallica", "Megadeath", "Slayer", "Anthrax", "Pantera", "Exodus", "Sodom", "Kreator", "Destruction", "Testament", "Sepultura", "Machine Head"] 
  
  
- genre_id: "11.07"
  name: "Early Black Metal & Speed Metal"
  year_emerged: 1982
  description: |
    The term Extreme Metal is rarely being used, as it is not a genre on its own, but a combination of two obscure but important genres: (early) Black Metal and (true) Speed Metal.

    With the explosion of British and Thrash Metal in the early eighties, some bands realized the extreme potential Metal had to offer. Two similar genres became the product of experiments with Metal outside the regular comfort zone. A small number of these bands created dark, evil, atmospheric Metal (early Black), while others turned the energy and tempo of Thrash even higher, forging Speed Metal. Sometimes the term Speed Metal is reserved for early Thrash Metal, forming a sort of proto genre, or simply as a synonym for Thrash. In the strictest sense, Speed Metal is faster, and more melodic than Thrash. Lead guitarists display extreme craftsmanship in extensive virtuoso solos, playing ever more rapid than before.

    Nevertheless, the first wave of Black Metal is barely slower than Speed Metal. Pioneering band Venom and their debut album that immediately named the genre, laid out Black Metal’s foundations: distortion, noise, feedback, chaos, shrilling/high-pitch sounds, velocity and satanic themes: a succubus screaming in agony. Black Metal marked a pivotal moment in Metal history. Now it was time to make truly evil music, and no longer just pretend to do so.
    
  artists: ["Venom", "Bathory", "Mercyful Fate", "Celtic Frost", "Morbid", "Hellhammer", "Slayer", "Exciter", "Anvil", "Annihilator", "Accept"] 
  
- genre_id: "11.09"
  name: "Doom Metal"
  year_emerged: 1984
  description: |
    Classic Metal band Black Sabbath laid at an early stage (with some of their slower, more ominous songs) the foundations for a lesser known but influential Metal genre: Doom Metal. The utter despair found in their music (and which can also be heard in Gothic Rock) forms the key ingredient of Doom Metal. This is a genre that sounds the way one would expect: hopeless, lethargic and bombastic. Doom Metal often deals about the occult, whether in band names, track titles, imagery or lyrical content. The lyrics are often slightly howled, sometimes with echo, which remind again of Black Sabbath. It’s the slowest form of Metal, and one that came around at a time when Metal only seemed to want to go faster and faster (Speed Metal). A number of bands felt the urge to provide some sort of counterbalance. The lower tempo of Doom Metal leaves lots of room for silence between the ultraheavy sluggish riffs. Not all songs by Doom Metal bands are strictly Doom, some are quite fast and simply Heavy Metal, which would influence Stoner/Sludge Metal bands, as the only alternative approach for non-hyperactive artists. Alongside this evolution, Doom would also crossover with other styles resulting in a lot of different subgenres, such as Atmospheric Doom, Funeral Doom, Doom/Death and Dronemetal or Dronedoom. Modern Doom Metal also experiments with electronic techniques, often found in Ambient and Industrial music, which enhance its droning properties.
    
  artists: ["Saint Vitus", "Pentagram", "Trouble", "Cathedral", "Electric Wizard", "The Obsessed", "Candlemass", "Witchfinder General", "My Dying Bride"] 
  
- genre_id: "11.10"
  name: "Death Metal"
  year_emerged: 1986
  description: |
    Death Metal can be seen as the leading force in contemporary Metal. It has little to do with death (though the topic isn’t avoided), as it sounds more alive than anything else. In form it is similar to Thrash Metal but heavier, deeper, and with updated distortions/effects. Accompanied by extremely deep growling vocals (grunts), it is downright brutal and performed as if the artists are trying to shrug off intense pain. Being a vast genre with multiple subgenres, it would almost be appropriate to call it mainstream modern Metal. Many artists would disagree though, as one of its tendencies is to always push the boundaries (shifting away from “popular“ approval) and becoming even harder, faster, stronger, and more reckless.

    The first (US) wave of Death Metal in the late eighties, was an even faster continuation of Thrash Metal. Because guitar velocity had become so high, Metal drummers developed a special hyper fast drum technique, called “blast beats”. This wave was very rough, unpolished, and with little melody – almost a feral form of Metal, which later strongly influenced Grindcore during its development.

    The second (EU) wave of Death Metal aka Melodic Death Metal happened in the nineties and particularly in Sweden, which is why it’s sometimes referred to as (the New Wave of) Swedish Death Metal (NWOSDM). The second wave is a lot more melodic than the first one, with more synth influences and different (sometimes instrumental) passages throughout the music.

    Apart from (and overlapping with) these two large waves, Death Metal has numerous subgenres, indicating the versatility and popularity of the genre. The most important ones are the self-explanatory Brutal Death and Tech(nical) Death, alongside crossovers such as Death Doom and Deathcore.
    
  artists: ["Death", "Deicide", "Morbid Angel", "Obituary", "Cannibal Corpse", "Possessed", "Dark Tranquillity", "Children of Bodom", "In Flames", "Soilwork", "At the Gates", "Arch Enemy"]
  
- genre_id: "11.11"
  name: "Stoner Metal/Rock & Sludge Metal"
  year_emerged: 1989
  description: |
    When Space Rock (a more Metal oriented continuation of Psychedelic Rock) encountered the slow, marching, and almost hypnotizing rhythm of Doom Metal, a match was made in heaven: Stoner Metal. Stoner Rock or Metal received large appeal from sedative and hallucinogenic drug users, which explains its name. Influenced by (psychedelic) drugs, this kind of Heavy Metal featured heavy sluggish riffs and a lot of distortion and (spacey) sound effects. Stoner songs are longer than usual with repetitive melodic outros (like a sort of Trance Metal).

    In the mid-eighties, Stoner blends with more energetic and louder genres, such as Hardcore Punk and Grunge. The result is a very thick and psychedelic but also fast and technical sound: a sludge of heavy guitar music, which kept gaining popularity until this day: Sludge Metal. Both Stoner and Sludge Metal’s characteristics make these genres the most Rock-like types of Metal, which is why they’re also called “Rock” or simply Sludge and Stoner to avoid any conflict. Sludge is the latest development in a separate strain of drug-influenced and psychedelic Heavy Metal: Acid Rock & Classic Metal → Space Rock → Doom Metal → Stoner Metal → Sludge Metal.

    Many Stoner or Sludge Metal songs are also recognizable by their slow-motion soundwall of interwoven distorted guitar riffs, sounding as if the apocalyptic revelation of an evil god is near.
    
  artists: ["Monster Magnet", "Kyuss", "Orange Goblin", "Spirit Caravan", "Bongzilla", "Kylesa", "Crowbar", "Eyehategod", "Mastodon", "Baroness"]
        
- genre_id: "11.12"
  name: "Symphonic Metal & Gothic Metal"
  year_emerged: 1990
  description: |
    Eventually the melancholic, haunting sounds of Gothic Rock found their way to heavy metal (Doom Metal has more in common with Classic Metal than Gothic Rock). The energy and wildness of other Metal was incompatible with Goth, but the much slower, darker Doom / Stoner Metal was almost proto Gothic Metal. True Gothic Metal is only a very small genre though, because the combination of Metal and Gothic is a precariously balanced one, quickly turning into Darkwave or something not Gothic. A more stable and durable genre was achieved by trading the synth sound for classical music (Symphonic Metal) with professional singers (sopranos, tenors…). The outcome is chaotic, romantic and mesmerizing Metal, but with a dark, despairing and brutal undertone (Doom meets Death) which made it appropriate to be also called Gothic Metal. Therefore it is advisable not to separate these genres as they share too much overlapping. Gothic Metal is known for the use of female band leaders/vocalists which makes the genre arguably the least macho of all Metal genres. With melancholic or poetic themes, usually embedded in an extremely escapist fantasy world of angels, elves and crystalline beauty, Gothic Metal could come straight out of The Lord of the Rings or a mythical role playing computer game. Heavy Metal has a number of very popular subgenres related to Gothic Metal, which also dwell on fantasy worlds (but this time of dwarves, druids and Vikings) like Folk Metal and Viking Metal.
    
  artists: ["Tristania", "Theatre of Tragedy", "Nightwish", "Paradise Lost", "Type O Negative", "Tiamat", "Therion", "Lacuna Coil", "Within Tempation", "The Sins of Thy Beloved"]
  
- genre_id: "11.13"
  name: "Black Metal"
  year_emerged: 1991
  description: |
    The genre outlined here is actually the second wave of Black Metal (See: Extreme Metal). The first wave was very obscure and rapidly vanished. Norway, a country of cold, harsh, and unforgiving landscapes, became the perfect breeding ground for Black Metal - arguably the most extreme and least accessible form of metal. Although Black Metal is a less percussion and bass oriented than its contemporary counterparts, its chaotic, screaming avalanche of macabre noise sounds like it was made by the Devil himself. Hi-pitched vocals, symphonic/Gothic elements, and shrill, hyperfast guitar riffs make such a statement almost believable. Black Metal has always been more about the content than the music itself, trying to be as satanic and anti-Christian as possible (and so are many of its practicers). The exact opposite however, is also true, in the form of Christian Black Metal, indicating that probably any genre imaginable already exists.

    Black Metal bands are recognizable by their bombastic music, satanic names, elaborate artwork (usually with a chaotic web of sharp forms) and heavy black & white make-up (reminiscent of Glam Metal but much more grim and serious). Themes of torture, pain, blood, and sacrifice occur more than in other Metal genres. Some Black Metal bands became frontpage news by committing acts of murder, violence and desecration, leading to a large amount of indepth Black Metal documentaries about this most evil of music genres.
    
  artists: ["Dimmu Borgir", "Gorgoroth", "Mayhem", "Emperor", "Immortal","Satyricon", "Burzum", "Tormentor", "Darkthrone", "Cradle of Filth"]
  
- genre_id: "11.14"
  name: "Nu Metal & Rap Metal"
  year_emerged: 1995
  description: |
    The Scandinavian styles of Metal (Black, mainly Norway / Death, mainly Sweden / Gothic, mainly Finland) would change the Metal music industry for years to come, but also pull it more underground. A new mainstream, popular genre was bound to emerge, as the same (dinosaur) Thrash and Classic Metal bands kept filling stages over and over again. The heaviest genres of the time (Death, Industrial Metal and Metalcore) were all thrown into an eclectic mix, but mostly Groove Metal and Rap Rock formed the basis for Nu Metal. These genres were only a small step away from fusing Rap or Breakbeat elements into Metal. The outcome was a recipe that could not fail because it was Rap, Rock, and Metal all-in-one. Indeed, “New Metal” had many Rap and few Metal elements: downtuned riffs, breakbeats, scratching, emphasis on kick drums and most noticeably no guitar solos, though the genre lacked no heavy bass or aggressiveness. The difference between Nu Metal and Rap Metal is rather negligible; the latter is reserved for songs which explicitly feature Rap lyrics, though they are both heavily influenced by Rap Rock.

    Nu Metal is often linked to Emo(core), as piercing lyrics about frustration and depression (self-mutilation, suicide, abuse, etc.) find its way into the heart of adolescents through melancholic choruses; a very distinctive rupture with previous Metal genres. Fashion is another topic where Nu Metal breaks the rules, with a bizarre mix of Emo and Metal styles and some marginal extravaganza. All these elements contribute to a living paradigm of disturbance: psychosis in sound and flesh.
    
  artists: ["Limp Bizkit", "Korn", "Slipknot", "System fo a Down", "Deftones", "Linkin Park", "Papa Roach", "Biohazard", "Mudvayne", "Coal Chamber", "P.O.D"]

- genre_id: "11.15"
  name: "Metalcore/New Wave of American Heavy Metal"
  year_emerged: 1995
  description: |
    In a desperate attempt to prevent Nu Metal from remaining the last chapter in the history of Heavy Metal and to prove that Metal would survive in the 21st century, the ambiguous term NWOAHM (New Wave of American Heavy Metal) was conceived. This was far from necessary, as Metal is perhaps the only super-genre were all different styles are still being practiced and performed intensively. At first, this wave of American bands seemed only unified in their stance against Nu-Metal, but gradually a specific, well-defined genre unfolded, named Metalcore. It must be noted that Metalcore already had a long and experimental history before Nu Metal, emerging shortly after Crossover Thrash, but remaining rather obscure before the mid nineties. Instead of mutually aggravating each other towards the extreme like Grindcore, Metalcore is a balanced mix of Hardcore and (Death) Metal elements, which undoubtedly has led to longer, more complex songs. The song structure and mentality is still Hardcore, but with a slower drum beat and metallic single note guitars. Metalcore is the least emotional type of Hardcore, which has led to the hyperrational, technical Mathcore or Math Metal and Math Rock. Other, lesser known subgenres include Melodic Metalcore, Noisecore, Deathcore, and Nintendocore. Metalcore is a forced marriage between Hardcore Punk and Metal in order to save both genres their legacies, despite mutual differences. Nevertheless, Metalcore’s numerous offspring subgenres prove the healthiness of this marriage in one way or another.
    
  artists: ["Killswitch Engage", "Bullet for My Valentine", "Shadow’s Fall", "Chimaira", "Lamb of God", "God Forbid", "Hatebreed", "Avenged Sevenfold", "Corrosion of Conformity", "Unearth", "All Out War"]
  
- genre_id: "12"
  name: "Industrial"
  description: |
    Industrial is a genre in between Rock and Electronic music. It evolved out of the German post-war underground scene in the seventies, and has been experimental and obscure ever since. Gothic music, following out of “Post-Punk Depression”, shares many characteristics with Industrial and both subcultures have become intertwined into a state of Siamese twins. Author John Savage outlines five different aspects of Industrial music that show a great deal of insight into this rather secluded genre: organizational autonomy, access to info, use of synth and anti-music, extra-musical elements, and shock tactics.
    
    The first one - organizational autonomy - can be traced back to the roots of the genre’s name: Industrial comes from Industrial Records, the first Industrial record company and more an extreme experiment than a real enterprise. The name however is no coincidence: early Industrial criticizes contemporary art by going either backwards (dark retro/industrial age) or forwards (dark cyber/futurism). Musical references to factory and industrial life (noise, machines) strengthen Industrial’s name. Industrial however does not follow any rules but likes to create the illusion of a heavily organized machine, with visual references to totalitarian regimes such as strong logos, artwork in black-red-white, and band names that are conceived as unstoppable movements on their own. Special fashion subcultures that combine “industrial” looks with either futuristic or retro aesthetics such as “Steampunk” or “Cyberpunk”, enrich modern Industrial subculture, and are sometimes mistaken for music genres.
    
    Industrial is also keen on introducing synth and anti-music (read: noise) into its songs to create the atmosphere of retro-futurism or even more appropriately “techno-paranoia”, reminiscent of American novelist William S. Burroughs. The song structure of Rock gets combined with the sound effects and instrumentation of electronic music, specifically Downtempo, Techno, and Trance. Industrial has a slower, hypnotizing tempo compared to Rock and a pronounced, perfectly regular (almost in a military fashion) rhythm that pounds throughout most Industrial tracks. This has led to the implementation of the word “Techno” on many Industrial genres, such as “Technoid”, “Dark Techno”, “Cybertechno”, and so on. But Industrial is nothing like Techno: there is no groove or soul within, only a dark, pulsing force that is torn and tortured by its own resourceful consciousness.
    
    The forth aspect of Industrial, extra-musical elements, concerns visual art and fashion, but most importantly performance art. Industrial culture is known for its extravagant music concerts. The earliest music shows in the seventies already explored the outer limits of what is morally acceptable on stage and then leapt far and wide over these limits. Not only on stage but also in cover art and lyrics, shock tactics are being used by Industrial: references to fascism and Nazism, torture, self-mutilation, deviant sex, and psychotic, disturbing imagery or voices, all intensified by the dark and heavy sound of Electronic Rock. But Industrial is anything but fascist; the music holds a mirror to those who wrongfully believe so and teaches how people are easily manipulated by media and the visual. Industrial is a philosophical meta-genre, which is why it values access to info.
    
    Industrial has always believed that music is unable to change the world. Yet it tries nevertheless, resulting in a schizophrenic identity of aggression/noise versus melancholy/depression.  This ironic paradox explains many of its characteristics and why few understand and appreciate the music. But more remarkably, is what makes Industrial unique among super-genres: the fact that it has managed to survive all this time while staying practically completely underground (the odd Industrial Rock superstars excluded). The reason is a steel subculture: strong and durable and more important than a technical common ground. Indeed, when one listens to Noise Music or Early Industrial and compares this to Futurepop, the difference can hardly be larger. But as long as there is something repulsive about contemporary society, Industrial, regardless of style, has a reason to exist.
    
  artists: ["Kraftwerk", "Bauhaus", "Skinny Puppy", "Nine Inch Nails", "Marilyn Manson", "Rammstein", "Rob Zombie"]

  
- genre_id: "13"
  name: "Pop"
  year_emerged: 
  description: |
    Pop music is difficult to define. The content of its definition has shifted throughout the course of time. What started as a network of white songwriters manufacturing premade songs for crooners and groups (Tin Pan Alley), became an individual crusade (singer/songwriter) and eventually a herald for integration and emancipation, where blacks as artists and teens as audience were given recognition and a platform.

    From the sixties until the eighties, Rock forms the basis for Pop, but that foundation shifts towards House in the nineties and R&B/Rap in the nillies. Lately (from 2010 onwards), Pop has become too eclectic to identify another super-genre within as the dominant core. Whatever that core may be, Pop is always a lighter, more accessible variant with catchy, pronounced melodies, but not too complex. Pop songs are always 100% radio friendly, i.e. they are edited to play up to four minutes or less and have politically correct lyrics, often bordering on shallowness. Pop has plain song structures, which are easy to memorize and so are the chords or melodies. A strong focus on video clips and visual performance have become staples in the Pop industry throughout the years, as most Pop does try to sell. More than any other super-genre, Pop has a commercial nature, or – in better terms – Pop transmutes in what sells the most.

    The word “Pop” is short for popular music and first coined in the fifties. Crooners from that decade were the first to be mentioned as “pop”. These artists had a tremendous popular appeal and their songwriters would seek inspiration from the most diverse genres in order to attain the perfect success formula. This means that at first Pop was not seen as a separate genre, but a collection of music from different genres that are the most popular. This is of course a matter of perspective. But although Pop may be vague as a group, especially in the beginning, its various subsequent subgenres are often well-defined. Therefore Pop is rightfully a super-genre on its own. Sometimes Pop is being used as a term for all popular music, but this is highly confusing and will not be used in musicmap.

    The strength of Pop music lies in a denial of genre or niche: Pop does not try to bring a new subculture or convey a message. It wants to include anyone and everyone and just have fun. Pop wants to be approachable: no barrier, no threshold, no shame. Anything goes. But Pop should not be seen as a derogatory term: every person adores at least one Pop song, whether it’s Britpop, Synthpop, Disco Pop or whatnot. Pop after all, is not irreconcilable with innovation or quality. But what exactly defines Pop music then? Pop is whatever gets the most appeal from people, the common denominator between different music tastes and the most flexible, applicable of styles. Never too extreme in one aspect or another, yet never too mundane or boring; Pop seeks to catch the attention fast and hold it, but never in an offensive or disturbing way.

    In the US, the repressive authority of the Bush administration on Dance/EDM parties in general has led since its inauguration in 2000 of a stronger intertwining of Dance, especially House, with other genres such as Rap, Nu R&B and Pop music. Electronic samples and the use of soulful vocals start to appear on EDM records that would otherwise be ignored. American EDM artists were forced to cross over to Pop in order to financially survive and this has led to an even greater diversity, complexity, and eclecticism in contemporary (Pop) music. After the Obama inauguration, “pure” EDM breaks through in the States, something that hasn’t happened since its birth in Chicago and Detroit. However, by that time, Pop, Dance, Rap, R&B, and Rock were already so clotted up (not the least by the advent of streaming music services and growing multimedia) that it might even be reasonable to discard Pop as a separate super-genre and regard it as simply a collection of the most popular and commercial music – just like it was in the beginning.
          
- genre_id: "13.01"
  name: "Pop Crooners"
  year_emerged: 1957
  description: |
    Pop music is a commercial and light variant of either Rock or R&B music, often crossing over to whatever genre sells the most. However, before Rock music, producers were already creating Pop music. The dominant source of Pop in the early 20th century was Tin Pan Alley: a musical neighborhood in New York near and for Broadway (thus aimed at musicals). Nearby was the famous Brill Building. When EP’s became more and more commonplace in the fifties and the first hit parade appeared (in 1952), this building turned into a giant busy hive, filled with countless recording studios. At first, Brill Building’s focus lay at creating music for the family, but that all changed in the late fifties. As a response to Rock ‘n’ Roll’s popularity, professional Pop producers crafted teen oriented hit songs. Charming male crooners in the fifties and hired girl groups in the sixties were meant to express an irresistible image of sexiness, turning their work into large profits. The first crooners appeared in the twenties and were named after their singing technique of gently moaning in the microphone. A large difference with (poorer) hollers or shouters in Blues who had to use all the volume their voices could produce, as they had no voice amplification. Brill Building Pop evolved from a more minimal singer/songwriter type of music (early Tin Pan Alley pop music) into a light version of Rock ‘n’ Roll written in 6/8 signature with Latin or exotic sounds, strings, children’s melodies and Rhythm ‘n’ Blues influences. The most famous producer of this era is undoubtedly Phil Spector, who helped reach many Girl Groups and Golden Age Rock bands achieve stardom with his “Wall of Sound” recording technique.
  artists: ["Neil Sedaka", "The Righteous Brothers", "Paul Anka", "Frank Sinatra", "Gene Pitney", "The Dixie Cups", "The Shangri-Las", "Pat Boone", "Del Shannon"]

- genre_id: "13.02"
  name: "Bubbleegum & Teenybop"
  year_emerged: 1957
  description: |
    The sixties was a glorious decade of prosperity and happiness, but also of new inventions and gadgets for the whole family ushering the age of consumerism. A lot of babyboomer teenage children (or even preteens) were a perfect target for a new music genre, fittingly called Bubblegum (Pop). Music producers (acting like franchise CEO’s) took Rock ‘n’ Roll and stripped it down to simple, melodic Pop music that was premanufactured, commercialized, bought and sold. Bubblegum often featured ‘fun’, colorful instruments such as Hammond Organs.

    Teenybop was pop music specifically made for very young or sensitive teens, which dealt about melodramatic and sentimental events (such as the first high school crush etc.). It’s clear that Teenybop shares a great deal of resemblance with Bubblegum: music as shiny merchandise or therapeutical triage for children. Bubblegum became an umbrella term for any studio based catchy tune under three minutes, and eventually used as a negative synonym for shallowness and lightheartedness, despite a number of independent Garage Rock and Rockabilly Pop bands creating similar music.
  artists: ["Archies", "The Monkees", "The Jackson 5", "Osmonds", "Leslie Gore", "Ohio Express", "Rubettes", "The Everly Brothers", "Little Eva", "Little Peggy March", "The Shocking Blue"]
 

  
- genre_id: "13.04"
  name: "Singer/Songwriter"
  year_emerged: 1971
  description: |
    Starting in 1967, Folk Rock slowly breaks loose from its predefined constraints and gives birth to perhaps the most immortal of music genres: Singer/Songwriter (S/SW). This marks a pivotal moment in music history: the artist in Pop music is no longer simply the performer of prewritten lines, but the author of them as well. By 1971 (not by chance at the start of the decade of individualism), the genre has fully taken form. Personal stories and emotions take precedence over social criticism and community feeling. Folk Rock provided wavering crooners with the confidence they needed to pursue solo careers and attain artistic independence. The essence of Singer/Songwriter lies in its lyrics: a revelation of inner thoughts in a poetic manner, often as exposing as possible. The accompaniment of these lyrics is also performed by the Singer/Songwriter, almost always with a single guitar or piano. During the early eighties, Singer/Songwriter leads with a series of alternative subgenres to Indie Pop & Rock, such as College Pop, Lo-Fi Pop, Neo-Folk and later Slowcore. Other subgenres are either dependent on the type of song (function) or the region (sentimental ballads, reactionary protest songs, Dutch Kleinkunst, smooth poplike Bleakfolk, Soft Rock as proto S/SW…) In France, the most important subgenre known as Chanson (“Song”) already experienced a rich history during the entire 20th century. Chansons are even more emotional than usual and have a strong historical connection with French film, literature, and theater.
  artists: ["Tim Buckley", "Leonard Cohen", "James Taylor", "Neil Diamond", "Tom Waits", "Neil Young", "Joni Mitchell", "Roy Orbison", "Jaques Brel", "Edith Piaf", "Serge Gainsbourg"]

- genre_id: "13.05"
  name: "Early Pop Rock & Power Pop"
  year_emerged: 1973
  description: |
    Power Pop, one of the first true Pop Rock genres, is in fact a revival of Mersey Beat, a second British Invasion so to speak. However, you can hear an important difference: the riffs are played with short, energetic strokes, enhanced by fast, repetitive drum beats. This property gives Power Pop a very ‘spikey’ and hyperactive feel, hence its name. The emergence of Power Pop and the early types of Pop Rock that went along with it, must be seen as compensation for the ‘darker’, more serious types of Rock (Pub Rock, Roots Rock, Mod) popping up in the UK in the early seventies. To steer the people (read: teens) as far away from these ‘bad’ types of Rock as possible, the sound of Power Pop went in the opposite direction: happy, melodic and light. At the end of the seventies, Power Pop experienced a second wave, and in the nineties a third one. The success of Disco and derivatives trumped Pop Rock’s second wave and strongly suppressed the genre in the eighties. The original fusion of Hard Rock and Mersey Beat (first wave) became tainted by other genres during these succeeding waves, leading eventually to dissolution into other genres, though a number of Power Pop artists are still active. Original Power Pop served as a blueprint for many later Pop Rock artists, which were drawn to the bare simplicity of Classic Rock without psychedelic influences or extensive post-production.
  artists: ["The Knack", "The Romantics", "Big Star", "Cheap Trick", "Badfinger", "Raspberries", "Matthew Sweet", "The New Pornographers", "Liquido", "Weezer"]
  
- genre_id: "13.06"
  name: "Soft Rock/Adult Contemporary"
  year_emerged: 1977
  description: |
    Some A.O.R. bands took a lighter approach (no guitar solos and less bass) and created Soft Rock (though sometimes the two genres are hard to separate). What started as an alternative countermovement became so commercial that eventually it was pure Pop music. Another break in A.O.R.’s trend is the stepping of more solo and singer/songwriter artists into the spotlight instead of faceless bands. The outcome and legacy of A.O.R. was a large and soft genre, yet not targeted at teens (compared to other Pop), but specifically for adults: Adult Contemporary (which can be seen as a synonym for Soft Rock). The name Adult Contemporary did not start out as a genre but as a billboard category for music, officially installed in 1979. Adult Contemporary (or A.C.) replaced the Easy-Listening category, and as such it is rather lightweight music for more mature people who like their music relaxing and politically correct. The term A.C. got retrospectively applied to all kinds of Soft Rock, even before 1979. Unsurprisingly, there is quite some overlapping with similar genres such as Country Pop, Smooth Jazz, New Age and Singer/Songwriter. In the eighties, a small, sentimental, “sophisticated” subgenre emerged, known as Sophisti-Pop. Sophisti-Pop uses more synth than regular Soft Rock, though subdivision within the eclectic style of Soft Rock is a bit hair splitting. Adult Contemporary is still being broadcasted on specialized radio channels throughout the world, as these golden Pop Rock classics seem to have a timeless appeal.
  artists: ["Phil Collins", "The Carpenters", "Fleetwood Mac", "Barbra Streisand", "Howard Jones", "Paul Young", "Carly Simon", "Olivia Newton-John", "Simply Red", "Level 42", "Living in a Box", "Johnny Hates Jazz"]
  
- genre_id: "13.07"
  name: "Synthpop & New Romantics"
  year_emerged: 1981
  description: |
    In the eighties, Synthpop reigns supreme: electronic New Wave that became highly popular due to the combination of a recognizable Pop/Rock song-structure and new and exciting synthesizer sounds. The release of the Yamaha DX7 in 1983 as the penultimate polyphonic synthesizer dramatically increases the production of Synthpop music. Guitars are barely noticeable, if they are present at all or not replaced by “keytars”. The difference between original New Wave and mid-eighties Synthpop is quite large. It’s less aggressive and more melodic, with less Rock and more Pop. It’s sleek and sterile, contagious and danceable, accessible and fun. Another difference is the increased emphasis on fashion, style, glamour and make-up. However, the gradual evolution from Wave to Synthpop ensures that a lot of music falls in between and New Wave becomes an interchangeable term with Synthpop. In this momentum a temporary movement also existed, known as the New Romantics: a hybrid Synthpop/Wave with Disco influences.

    Synthpop can be a misguiding term, as the genre is probably the least Pop-like of all Pop genres in terms of mentality. Many Synthpop artists crave experimentalism and conceptual music, building further on the legacy of (Post-)Punk. Synthpop was also one of the few music genres heavily featured on early MTV, alongside Disco Pop, Glam Metal and Golden Age Rap. Difficult arrangements (like Post-Punk), yet simple, futuristic and flashy songs have granted Synthpop an endless appeal, with a far reaching influence and even revivals of revivals.
  artists: ["Depeche Mode", "Soft Cell", "The Human League", "Duran Duran", "Talk Talk", "Alphaville", "Eurythmics", "Pet Shop Boys", "Tears for Fears", "Gary Numan", "Visage", "Bronski Beat"]
  


- genre_id: "13.09"
  name: "Post-Disco Pop"
  year_emerged: 1984
  description: |
    In the aftermath of the great Disco supernova implosion, a supermassive, eclectic post-genre opened up, attracting a bit of everything that was hot at the time (but mostly Synthpop and a touch of instant recognizable glammy metallic guitar solos). The result is Discopop or Post-Disco: a collection of all Disco-based Pop music that is almost synonymous with “the sound of the eighties”. The demise of Disco happened parallel with the demise of Post-Punk, the aftershock of the oil crisis, and the steep rise of Colombian cocaine and techno-materialism. This was music for the age of superficiality: a thin layer of neon, fast vehicles, palm trees and white powder, barely capable of concealing a yolo-mentality that denied any fear it was actually based upon.

    But there was more than synthesizer bands stuck in an escapist wave of Disco nostalgia. Disco-Pop is mainly the embodiment of artists with a R&B background (Soul) who got influenced by its successor Disco, but never really made pure Disco music (as this was strictly dancefloor material). Instead they released Pop crossovers and became international superstars, selling more records than anyone before. Their music is often (mistakenly) labeled as “Dance Pop”, a reference to its irresistibly moving nature. By combining the most-catchy elements of Rock, Synth and R&B, while also implementing less conventional chords and song structures, professional Pop producers donated their artists immaculately crafted superhits eternalized in music’s collective memory.
  
  artists: ["Michael Jackson", "Madonna", "Whitney Houston", "Moti Special", "Miami Sound Machine", "Sabrina", "Laura Branigan", "Tina Turner", "Samantha Fox", "Lipps Inc.", "Yazoo"]
  
- genre_id: "13.10"
  name: "Indie Pop"
  year_emerged: 1986
  description: |
    1979, a third lesser known wave of Folk Rock emerged in the southern states and mingles with related Country Rock. This wave, known as College Pop, becomes more poppy, lo-fi and increasingly amateuristic in sound. By 1982, the formation of College Pop into so called “Lo-Fi Pop” is complete. In the same communities there was an interest in (Hardcore) Punk Rock’s DIY approach too as well as the brand new Jangle Pop/Indie Rock style too. This led to a softer version of the latter, with more focus on melody and less of an abrasive sound harnessing positive, sentimental emotions instead of Indie Rock’s negative angst-filled ones. Therefore Indie Pop is also sometimes known as “Twee (Pop)”. A lot of Indie Pop artists were affiliated with the noteworthy K-Records label. Indie Pop became widely known thanks to New Musical Express’s C86 tape (the successor of its C81 tape), which was a compilation of Indie Pop artists in 1986. These artists never achieved the same fame as their Rock companions, but were influential as a whole. Witnessing an unsophisticated, almost rudimentary sound by such an overwhelming amount of artists instilled a great deal of confidence in many Rock and Pop bands to come. Because even though Twee Pop is mostly associated with the late eighties, the genre is still a significant music style, harboring a vast number of Alternative Pop artists.
  
  artists: ["Primal Scream", "The Pastels", "Beat Happening", "The Wedding Present", "The Magnetic Fields", "Belle and Sebastian", "Tiger Trap", "The Field Mice", "The Shop Assistants"]
  
  

- genre_id: "13.13"
  name: "Modern Pop"
  year_emerged: 2006
  description: |
    Modern pop is the direct successor to post-disco pop, but with more production and stylings typical to the 2000s and 2010s.
  
  artists: ["Lady Gaga", "Kylie Minogue", "Ke$ha", "Robyn", "The Knife", "Ladyhawke", "Lily Allen", "Taylor Swift", "Lorde", "Roisin Murphy"]
  
- genre_id: "13.14"
  name: "K-Pop"
  year_emerged: 1992
  description: |
    Originating in South Korea, K-Pop (Korean Popular Music) evolved into a global cultural phenomenon by synthesizing modern Western popular genres—primarily Hip-Hop, Contemporary R&B, EDM, and Post-Disco—with hyper-polished Korean production values. The genre’s modern framework began in 1992 with Seo Taiji and Boys, who introduced American Hip-Hop breaks and rap to mainstream Korean broadcasting. Modern K-Pop is defined by an intensive agency trainee system, multi-member concept groups, intricate synchronized choreography, and dynamic multi-genre switches within a single track. Visually driven and visually produced, K-Pop relies heavily on concept-driven aesthetics, high-budget music videos, and distinct performance roles (vocalists, rappers, visual leads) tailored for an intensely engaged global fanbase.
  artists: ["Seo Taiji and Boys", "BoA", "TVXQ!", "BIGBANG", "Girls' Generation", "BTS", "BLACKPINK", "TWICE", "Stray Kids", "NewJeans"]
    
    
- genre_id: "20"
  name: "Country"
  year_emerged: 
  description: |
    For many non-Americans unfamiliar with the music, Country feels like a small and insignificant genre. However, Country has been the United States’ most selling genre for several decades and still is among the top selling categories according to numerous statistics. During the seventies, American citizens could even tune in to more than 600 (!) different Country radio stations. The genre has always been closely linked with radio and was one of the first music genres to go on the airwaves and into the living room of many Americans. Because that’s what Country is all about: everyday life, family, home. It is no coincidence many Country bands are named as a family and/or are actual families. Strong family values form a common theme throughout Country’s history, but sometimes a darker reality of liquor, drugs, adultery and criminal behavior dispels that picture perfect illusion. Then, such a predicament becomes a catalyst that creates diversity within the genre. But Country deals about more than just family. God and the motherland form two other recurring core values of Country’s content. The lyrical subject of faith has created a link with Gospel (Country Gospel), and a distance with people of other religions.

    Being as old as it is, Country works mostly with very classic (string) instruments: banjo, fiddle, acoustic guitar, violin and harmonica. The genre has refrained during later decades from incorporating many other instruments, especially electronic ones. With a slow tempo and a sparse (often acoustic) set-up, Country puts great emphasis on voice. Many male and female Country singers are renowned for their voice, perhaps the most important instrument of the genre. Just like Folk Rock, the voice should have the power to convey emotional stories or ballads. Duets, especially man and woman talking about love, are also common within the genre. Country is based on traditional ballads or tunes with rather plain melodies and chords, similar to Folk music (which was an important influence on the genre).

    Because Country can be traced back to remote, wild, rural areas, the name is a reminder of its geographical origin. But Country quickly conquered the urban landscape, like Nashville, Tennessee, where the mythical Grand Ole Opry dance hall showcased all kinds of Country genres every week from 1925 until this very day. The word “Country” also hints at the patriotism embedded in Country’s subculture. A strong link with American culture and the pride of the nation give Country a strong domestic appeal, but a weak foreign one. However, certain Country songs and artists have become immensely popular overseas and show just how much power and emotion can be transferred throughout the genre.

    A particular aspect of Country is that it is sometimes regarded as the Caucasian equivalent of the Blues - the music of one stereotypical image: the common, traditional, Christian, American man. The two primordial billboard music categories left no doubt about this: popular music was either “race music” (made by blacks: Blues and black Jazz) or “hillbilly music” (made by whites: Country). Country subculture can be conservative and is sometimes accused of homophobic or racist incidents such as worshipping of the southern – slave - Confederacy. Yet the genre is far too broad and rich to narrow it down to its most politically extreme exponents. There were also succesful black musicians.

    A possible subdivision is the use of generations because Country is so family related. These (six) generations are often real family generations (famous Country singer Hank Williams and his almost equally famous son Hank Williams Jr. for example). The first and second generation are sometimes known as “Traditional Country”. The hegemony of Rock within white music culture prevents a large mainstream breakthrough of Country, especially on an international scale. But the unique and powerful characteristics of the genre grant Country still a strong appeal, almost a century long.

- genre_id: "20.01"
  name: "Early Country and Honky Tonk"
  year_emerged: 1925
  description: |
    Before Country, there was already evidence of a type of music played by white Americans living in the hills or rural areas (the countryside, especially Appalachia) and (so-the-tale-goes) often named Billy: the Hillbillies. They made acoustic music with whatever instrument they could lay their hands on: classic guitar, fiddle, mandolin, banjo, bass, and later Hawaiian style slide guitar. All these instruments produced sharp, short tones fitting for the rough, mountainous environment.

    Irish and British Folk music, popular among European immigrants in the US, laid the foundations for a new kind of hymn that formed the blueprint for Country. And under the influence of Blues and Celtic Folk, this liquor- (and gun-) fueled proto-country or Hillbilly music gradually became a whole new group of music. The lyrics of Classic Country dealt with individual stories like Blues, but were more suited for a younger audience (there was no place for sex and drugs in Classic Country). Country describes tales which support family values, despite a degree of drinking and shooting that went along with the music.

    Eventually Country gets shaped into a unique, fully fledged genre that also took cues from Tin Pan Alley pop music, ballads, and parlor songs. Unsurprisingly, this fresh and brewing melting pot quickly led to many small subgenres, such as Country Gospel (fusion with Gospel) and Cowboy & Western (Midwestern Country music recollecting the Far West).
    
  artists: ["Jimmie Rodgers", "The Carter Family", "Hank Snow", "Roy Acuff", "Goebel Reeves", "J.E. Mariner's Mountains", "Carl Sprague", "John Carson", "Harry McClintock"]

- genre_id: "20.02"
  name: "Western Swing"
  year_emerged: 1937
  description: |
    The big craze that was Swing swiftly got a hold on Country, because entertaining music for large venues where people could dance was a concept that could just as easily be done with Hillbilly music. Except this wasn’t done in fancy ballrooms or concert halls (like Swing), but good ol’ fashion barns. Especially in Texas and Oklahoma the genre proved very successful. When the new technology of amplified guitars was fitted into the hillbilly instrument ensemble, the eclectic genre Western Swing was born. Western Swing borrowed influences from just about any other popular music genre that was already invented (which was a rather scarce collection at the time). Swing rhythms, Jazz solos and many different instruments merged into an unrestricted and original genre. It was also one of the very first music genres to be broadcasted to a large audience by radio. But as radio made Western Swing great, the invention of television killed it.

    Western Swing is not the same as Western Country aka Cowboy & Western aka Cowboy music. This genre happened earlier during the early thirties and is your stereotypical cowboy music, often used in Hollywood films and reused by Tin Pan Alley.
  artists: ["Musical Brownies", "The Texas Playboys", "Hank Thompson", "Cliff Bruner & his Texas Wanderers", "Spade Cooley", "Asleep at the Wheel", "Merle Haggard", "Billy Mize & Bob Wills", "Pickin' On Band"]
  
# - genre_id: "20.03"
#   name: "Honky Tonk/Hardcore Country"
#   year_emerged: 1939
#   description: |
#     Country before the forties had a bit of a multiple personality disorder. While one part of it evolved as a crazy, fun barn dance music, the other part went the opposite way. It evolved as an introvert, back-to-the-roots music that wasn’t happy at all, and often involved tragic ballads, known as Honky Tonk. Most Honky-Tonk songs deal about relationship problems, alcohol abuse, financial worries or other misfortune. Instead of large barns, this music was played in the more intimate bars of southern USA, which were called “honky-tonks”. However, honky tonks were still large enough to force the artist to implement electric instrumentation, in order to top the crowd volume-wise. Honky Tonk also introduced a steady 4/4 beat to Country Music, which diverted the genre from Folk. Honky Tonk artists often sang with a thick, southern tongue and in a nasal tone. Combined with cowboy hat, boots, and costume, the caricature of the traditional Country singer was complete. Honky Tonk remains an important separate stream in Country’s history, and is sometimes synonymous with so called “Hardcore Country”. But Hardcore Country can also be an umbrella term for more traditional, pure forms of Country as opposed to eclectic “Soft-Shell” Country Pop or Alternative Country.
#   artists: ["Hank Williams", "Johnny Cash", "Al Dexter", "Lefty Frizzell", "Ernest Tubb", "George Jones", "Merle Travis", "Rex Griffin", "Kitty Wells"]
  
- genre_id: "20.04"
  name: "Bluegrass"
  year_emerged: 1947
  description: |
    Hillbilly Country evolved into something completely different in the forties. A lot of focus was put on the strings, which were fiercely fiddled, to create another type of Classic Country, called Bluegrass. Bluegrass took its name from one of the first practicing bands: Bill Monroe and the Bluegrass Boys, who in their turn were named after the state Kentucky aka “the Bluegrass Country”. Bluegrass is that typical, atmospheric, hi-pitched, hyperactive country most people know. Violins are very common, alongside mandolin, guitar and banjo. Although Bluegrass sounds like it’s not taking itself seriously, it is actually very reactionary and serious music, rising up against authority. Bluegrass is more zealous than other country genres, spreading forth revolution and highly religious messages, like a musical crusade. A bit like political Folk music one could say, but with a certain supercharged overdrive. Bluegrass swears off electric instruments and is always completely acoustic, like Folk. Improvisation or freewheeling is also a key Bluegrass element.

    The genre remained popular and even got some small subgenres, such as the progressive Newgrass in the seventies. The film “Oh Brother Where Art Thou” by the Coen Brothers in 2003 also created a strong reinterest in Bluegrass (and Country in general) during the nillies.
  artists: ["Bill Monroe & His Bluegrass Boys", "The Stanley Brothers", "Kingston Trio", "Alison Krauss and Union Station", "Flat & Scruggs", "The Osborne Brothers", "Bluegrass Diamonds", "Ricky Skaggs", "Blue Sky Boys"]
  
# - genre_id: "20.05"
#   name: "Bakersfield"
#   year_emerged: 1954
#   description: |
#     Bakersfield (Sound) is a lesser known type of Country, named after the place where it originated: the city of Bakersfield, California, so it could as well be called West Coast Country. Roots Country musicians came from the midwest to southern California where they brew up a melting pot of Honky Tonk with a pinch of Rock ‘n’ Roll and Western Swing.
# 
#     Immediately after the rise of Rock ‘n’ Roll, Country started to incorporate Rock ‘n’ Roll elements, but Bakersfield remained a rather traditional type of Country, honoring its Honky Tonk heritage. Typical Bakersfield instruments include Fiddle, Steel Guitar, Drums and Telecaster. This would make it seem that Rock ‘n’ Roll was only a small influence for Bakersfield. However, most instruments were electrified like Rock, and a pronounced backbeat showcased a large difference with its contemporary rival, Nashville Country (which actually was a backlash against Bakersfield’s Rock allures).
#   artists: ["Buck Owens and the Buckaroos", "Merle Haggard and the Strangers", "Tommy Collins", "Susan Raye", "Dwight Yoakam", "Wynn Steward", "Freddie Hart", "Dennis Payne", "Jean Shepard"]
  
# - genre_id: "20.06"
#   name: "Nashville & Country Pop"
#   year_emerged: 1957
#   description: |
#     Country expands drastically after WW II, thanks to a heightened sense of nationalism, a larger export market (babyboomers), an exponential increase in Country radio stations, and a bigger target audience due to the appeal of electric instruments. The Rock ‘n’ Roll revolution however, threatened Country’s prosperous expansion. Country revolted with a commercialized version of Honky Tonk, a genre that was content-wise quite the opposite of R&R. Honky Tonk had to lose its hardcore edge in order to become more popular. This resulted in a smooth, softer Pop-like Country, with more emphasis on strings and textured instruments. Its name came from the town where most of its slick producers intended to regain the influence back that R&R had stolen from them: Nashville, Tennessee. It was also the town where a lot of huge barn dances with Nashville country were being held, such as the legendary Grand Ole Opry.
# 
#     Eventually Nashville became even more polished in the form of mainstream Countrypolitan, though these genres may be regarded as synonyms. Countrypolitan experienced accusations of being too superficial and profit-oriented, with “Teflon”-singers in their western suits showing their snowwhite slick smiles and brilliantine haircuts. Nashville was crowned “Cashville”: an easy way to raise some bucks by cashing in on the Country cow.
#     
#     At the end of the nineties, Rock crosses over into two different directions: harder Blues Rock/Metal versus Country. What started as typical Folk Rock of the sixties, gradually got mixed up with Country and becomes Country Rock. This explains a great deal of overlapping between both genres. But via Folk Rock, Country Rock also reaches back to the fifties; to the pre-Merseybeat period. And this is its cardinal feature: Country Rock is specifically made for those who grew up with Rock ‘n’ Roll, but felt little connection with British or experimental Rock of the sixties. Most well-known artists have a pure Country background and are more interested in using the popularity of Rock to their advantage than the other way around. Strummed acoustic guitars (often 12-string), subtle drums and polyphonic vocals help combine the rebellious spirit of Rock ‘n’ Roll with the customs and arrangements of Country. Eventually Country Rock shakes off its rough feathers to breed Country Pop, though these genres are marginally different.
# 
#     A lesser used term associated with Country Rock, is West Coast Rock: a loose affiliation of California based Country/Folk/Rock artists of the sixties and seventies. Another term, used as a radio format category, is “Middle of the Road” or MOR., because the music is a middle ground between Rock and Country. Although many MOR radio stations preferred all kinds of Country Pop & Rock, in strict terms it refers only to music before the age of Rock ‘n’ Roll.
    
  artists: ["Tammy Wynette", "Charlie Rich", "Patsy Cline", "Eddy Arnold", "Jim Reeves", "George Morgan", "David Houston", "Stonewall Jackson", "T.G. Sheppard", "Dolly Parton", "Charlie Rich", "Loretta Lynn", "Kenny Rogers & The First Edition"]
  
- genre_id: "20.08"  
  name: "Progressive Country & Outlaw Country"
  year_emerged: 1973
  description: |
    In the seventies Country fused with Folk, Pop and Rock, creating many hybrid genres: the first wave was Country Pop, then Progressive Country, and a bit later Outlaw Country (after that followed Urban Country and finally Americana). Progressive Country revolted against the exaggerated slickness of Countrypolitan, using modern day, reflective lyrics. It was more about the songwriter and his message than to make people dance or buy albums. The artist becomes independent and this gets reflected in a Grunge-like image: dirty jeans, greasy hair, plain clothing. Just like Hardcore Country, it was reactionary, intellectual music from big cities with the attitude and instrumental influence from Rock. This form of Country Rock became more and more edgy and rebellious, earning the name Outlaw Country. But by 1978, Outlaw Country starts to dissolve already as the genre takes on different forms and reaches too much mainstream attention.
  artists: ["Willie Nelson", "Waylon Jennings", "Kris Kristofferson", "Bobby Bare", "Townes Van Zandt", "Jerry Jeff Walker", "Billy Joe Shaver", "Steve Goodman", "Joe Diffie"]
  
# - genre_id: "20.09"  
#   name: "Urban Country"
#   year_emerged: 1979
#   description: |
#     The so-called second wave of Country Rock actually shifted Country further away from its original roots. Instead of becoming more hardcore, it turned into a slick and glossy archetype. It was barely Rock at all, it was more Country Pop. The popularity of “Urban Cowboy”, a film from 1978 starring John Travolta, got the style going and also lended its name to the genre. With poster boys (or girls) singing catchy, emotional songs without much tempo or volume change, they created sentimental soundtrack music that seemed ripped right off the next big romance or teenage blockbuster. Electric guitars and pianos were used to give Country a more modern feel and Pop Rock/Soft Rock influences were used to appeal Urban Country to an even bigger audience. The hip image of newer country dance clubs, like in Urban Cowboy, became an exploited illusion to sell Urban Country en masse. The commercial (or even greedy) mindset of Urban Country evoked a strong backlash by a new wave of alternative Country musicians who explored opposite directions with Americana.
#   artists: ["Mickey Giley", "Alabama", "Janie Fricke", "David Allen Coe", "Earl Thomas Conley", "Jason Aldean", "Luke Bryan", "Anne Murray"]
  

  
- genre_id: "30"
  name: "R&B"
  description: |
    Like the name implies, Rhythm ‘n’ Blues (“R&B” or “RnB”) is the powerful combination of two old music genres. Gospel (the Rhythm) on one hand, which provides an infectious groovy tempo that was already noticeable in its early barbershop days with handclapping and rhythmical vibrating voices. Blues on the other hand, which delivers warm chords and rich bass. “Gospel & Blues” combines diverse musical elements and is therefore a highly flexible hybrid genre, forming a bridge between many super-genres. R&B can be the middle ground between Blues and Rock, but also between Rap and Pop or Gospel and House, which makes it one of the most accessible music genres.
    
    The cornerstone aspect of all R&B is the backbeat: the 2nd and 4th beat of each bar becomes accentuated, creating a strong cadence. Backbeat makes R&B highly danceable, eventually leading to Disco and the concept of nightlife dance culture and clubbing. R&B is also known for more complex rhythms and drums; the introduction of the breakbeat or a high emphasis on percussion. Instrumentation follows out of the basic Blues set-up: guitar, bass, and drums. Yet almost always one or more instruments are added, selected by their ability to create a richer sound and radiate a warm, cozy feeling: violins, synth, vibraphone, Hammond organ, or brass horns.<br><br>Although R&B is rather a diverse collection of genres, the common themes of optimism, love and joy recur in all of them. A positive vibe, amplified by invigorating performances by artists with a charismatic, radiant appearance, makes R&B among the most popular of genres. Such joy is a clear rupture with R&B’s predecessor, Blues. Some smaller exceptions (Early R & B, Doo Wop) and one big one (Disco) put aside, all R&B can be divided into three strong families even more known than R&B itself: Soul, Funk and Urban.
    
    Soul is a secular and more pop oriented continuation of Gospel: gentle and emotional songs (usually about love) with high production values but even more benevolent willpower. Soul actually refers to a personal quality of high morality: a Soul person is a righteous being. Soul was the dominant mainstream music genre in the first half of the sixties and remained popular ever since. With multiple subgenres and three revivals (Neo-Soul, Vintage Soul Revival, and Future Soul), it is clear to see that Soul’s strength has barely diminished.
    
    Funk evolves out of Soul but reaches out to Jazz and a bit of Rock to create even more rhythmical music, based on a single chord. Funk brings a repetitive pulsing groove around which every song is built, making the genre more dance-friendly than Soul. Funk likes to use electric bass or electro synth distortions to create a “greasy” sound, while the percussion section is hardly distinguishable from the melody or bass section: all the instruments have become one - the Funk groove. The word funk is derived from old slang for the smell of sex: enough said. Many Funk subgenres have emerged and recent revivals prove an undying popularity, although Funk has never been mainstream nor underground: it knows exactly how to stay on the edge of the spotlights. Something that could not be said of Disco: a blend of Funk and Soul that takes over the entire popular music scene in the late seventies.
    
    Urban is the latest development of R&B, where it blends with Rap, Pop and a bit of Latin into a fusion that should function equally well for nightclubbing, album sales, live concerts or radio performances. Therefore Urban has become a very dominant music genre and often criticized for commercialism and shallowness. The word urban comes from the “Urban Contemporary” radio format, where the latest forms of R&B are played that are the most suitable for going-out (in city clubs, hence urban). As a result of Urban’s popularity, the general term R&B became synonymous with Urban and for many (young) people, these two genres are misinterpreted as one and the same. But real Rhythm ‘n’ Blues is an immensely large and diverse music family: a lineage with a tremendous passion and respect for its own productions, and usually with an almost obligatory request to get up and move.
  
- genre_id: "30.02"
  name: "Doo Wop"
  year_emerged: 1951
  description: |
    Doo Wop is an often neglected, but familiar and characteristic genre. It’s being performed by girl or boy groups that sing in vocal harmony: one person sings lyrics while the others perform backing vocals in a polyphonic symphony of gibberish and mumbling, humming sounds or onomatopoeias (like “Doo Wop”, hence the name). Sometimes Doo Wop features no instruments at all, it can be purely a cappella; a step further in the already modest instrumentation of Rhythm ‘n’ Blues. But Doo Wop can just as easily feature a supporting band or accompanying instrument on top of its barbershop group. However, this minimal set-up was for most Doo Wop artists not a choice: they were so poor that they couldn’t afford any instruments. And while many of them wandered around in New York city, hoping for a glimpse of fortune and fame, only very few succeeded. The ones that did, had the joy of their success resonating in their music. In its smooth, warm, cheerful sound (a sort of peaceful post-war happiness), one can already distinguish the yet-to-come embrace of Soul. Doo Wop has experienced revivals in subsequent decades and influenced in subtle ways a number of cross-genre songs.
    
  artists: ["The Platters", "Ink Spots", "The Mills Brothers", "The Coasters", "The Quotations", "Orioles", "Frankie Lymon and the Teenagers", "The Turbans" ,"Randy & the Rainbows", "The Clovers"]
  
- genre_id: "30.03"
  name: "Memphis Soul/Southern Soul"
  year_emerged: 1959
  description: |
    A lot of things had changed in 1959 since the ascent of R&B around 1943. It was a year of great opportunities and hope. In the southern and middle states of USA, black R&B musicians threw R&B, Gospel, Blues, and a bit of Country into a big melting pot. They were cooking something that was quite slow but also raw and emotional at the same time. This Rural aka Deep aka Memphis Soul became well known under the leading record company’s name: Stax, granting the name Stax Soul. Memphis Soul was not only the first kind of Soul, but also the most independent one. Musicians wrote their own music - straight from the heart - instead of producers or songwriters. The lyrics were often based on their experiences during the so called “Soul Circuit”: a trail in southern USA almost all Soul artists followed, with a high degree of love, sex and liquor along the way.
    
    Deep Soul tracks are recognizable by their low tempo, the use of clipped guitar, and a lo-fi production compared to other Soul. The latter two characteristics also show a gradual evolution towards Funk, the immediate successor of Deep Soul. When the music caught on in the UK, it was renamed as Southern Soul. 
    
    The genre rose greatly alongside national black awareness in the sixties, thanks to the civil rights movement and Martin Luther King. Southern Soul was the voice of black pride, but it wasn’t reactionary nor intimidating. Soul does not try to combat it opposes, instead it tries to disarm. Soul vocalists honor the Gospel tradition of forgiveness and harmony. The music is hopeful, warm and portrays intense stories about love and heartbreak that still sound sincere after all these decades.
  artists: ["Otis Redding", "Sam Cooke", "Irma Thomas", "Percy Sledge", "Betty Harris", "Sam and Dave", "The Dramatics", "William Bell", "The Soul Children"]
  
- genre_id: "30.04"
  name: "City Soul"
  year_emerged: 1962
  description: |
    After the rural areas, Soul quickly caught on in the urban areas, where it lost a bit of that rural roughness (just as happened with Country). First almost immediately in Chicago (Chicago Soul) and a bit later in the motor city: Detroit. These urban types of Soul were more uptempo and happy than usual (i.e. Southern Soul could sometimes be tragic). The experimental melting pot was turned into a factory-produced popular recipe: a strong backbeat, a bouncy, melodic bassline, <v>four part harmony vocals</v> (often female), a tight snare drum, and usually tambourines. It was heavily produced, polished music, especially by that record company that became so well known that its name is a synonym for the genre: Motown. Compared to Chicago Soul, Detroit Soul has more an “industrial” sound and production, and is a lot more danceable. Motown’s rhythm sections (drum + bass or tambourine) were all very uniform but thoroughly contemplated. Chicago and Detroit Soul became exceptionally popular with both black and white audiences (hereby connecting the two cultures), whereas Memphis Soul was purely black oriented. 
    
    In the UK, the B-sides of Motown records became popular as Northern Soul. Northern Soul is not really a separate genre. It started as a sales pitch to sell Motown to North-British youth, but soon exploded into a Rave-like subculture of wild parties, where the most dance-friendly, lesser-known Detroit Soul tracks were hunted and played from dusk till dawn.
    
    After Chicago and Detroit, a third type of “city Soul” emerged (the term urban Soul applies to something else). This time it happened in Philadelphia, where Soul would have a huge influence on a lot of music to come. Philly Soul partly grew out of the early sixties Girl Groups (the Shirelles, the Crystals, the Ronettes), forming the bridge between Doo Wop and Philly Soul. These Girl Groups were strongly related to Brill Building Pop: heavily produced (e.g. by Phil Spector), premanufactered Pop songs with enormous success. 
    
    Philly Soul shares many characteristics with Chicago and Detroit Soul, but it is even slicker and more commercial. Tragic and contemplative lyrics became replaced by playfulness. Philly Soul is not meant to listen to but to have fun with. The vocal interplay and horns are still present, but now they are accompanied by stimulating or sedative strings. Philly Soul is Proto-Disco: the seed that would grow the universal modern nightlife dance culture. 
    
    Philly Soul launched a significant rise of white artists who also started to make Soul, dubbed “Blue Eyed Soul”. Especially after the success of Disco, Blue Eyed Soul flourished and continues to do so, though the technical definition of the genre is vague if any.
  artists: ["The Supremes", "The Four Tops", "Stevie Wonder", "The Velvelettes", "The Miracles", "The Dells", "The Impressions", "Donny Hathaway", "Frank Wilson", "Mel Torme", "Tony Clarke", "MFSB", "The Delfonics", "The Three Degrees", "The O'Jays", "Barry White", "Philadelphia International All Stars", "The Spinners", "Loleatta Holloway", "The Shirelles", "The Crystals", "The Ronettes"]

   
- genre_id: "30.06"
  name: "Early Funk & P-Funk"
  year_emerged: 1968
  description: |
    Soul was very popular and melodic, but it wasn't really daring or danceable. After a while, artists started looking at Rock and Jazz for new elements. They preferred the psychedelic, rebellious nature of Acid Rock alongside the deep, dynamic part of Soul Jazz as flavours of choice for the revolutionary fusion that was Funk. James Brown, nicknamed “the hardest working man in show business”, spearheaded the evolution from Soul to what became known as Funk Soul and eventually Funk. But Funk's development was already tangible in the Swamp Funk of New Orleans from the forties, influenced by Louisiana creole. 
    
    Funk places strong emphasis on the first beat of each bar while the rest of the rhythm constantly changes, like an early form of breakbeat. This is known as “The Rhythm of the One” (the one beat, instead of four or two). All instruments work together to enhance this feeling. Percussion becomes accentuated by short, monotone riffs, slapping bass, brass instruments, and accents on synth/piano to create what is known as “the groove”: the pulsing force behind each Funk song. Some bands, starting with Parliament and Funkadelic, introduced a more spacey and less syncopated sound, known as P-Funk.
    
    Yet Funk does not try to blend all instruments into a carefully assembled and produced whole (like Soul) but it maintains their individuality to create a more organic sound. Funk tries to sound like primal energy or biological essence. Another difference with Soul is that Funk revolves less around songs and albums: the music is one continuous melting pot, where live performance and technical expertise are valued over touching lyrics and record production. The Apollo Theatre, New York, was such a place where many Funk artists blew the audience away with their virtuoso and vigorous performances.
  artists: ["James Brown", "Parliament", "Isaac Hayes", "Funkadelic", "Charles Wright", "Sly and the Family Stone", "The Bar-Kays", "Averate White Band", "Curtis Mayfield", "Maceo & the Macks"]
  
- genre_id: "30.15"
  name: "Louisiana Funk"
  description: |
    Regional funk style from New Orleans featuring second-line rhythms, brass band instrumentation, and syncopated polyrhythmic grooves.
  artists: ["The Meters", "The Neville Brothers", "Dr. John", "Rebirth Brass Band", "Galactic", "Dumpstaphunk", "Trombone Shorty"]
  
- genre_id: "30.07"
  name: "Disco"
  year_emerged: 1972
  description: |
    Some Philly Soul songs were accompanied by a pulsing, repetitive drum rhythm, which made them the best dance floor fillers in the exclusive gay clubs of New York (and elsewhere in lesser extent). With a dominant, accelerated 4/4 beat, sing-a-long diva choruses, catchy melodies (often intensified by sweeping strings), and much more superficial lyrics than Soul, producers had found such a perfect commercial combination of popular R&B elements that Disco broke out of its isolated environment and conquered the world in an unimaginable way. As pure ecstasy music, with no worries, Disco was all about having fun, sex, and dancing in the disc-o-theques: a new type of nightlife place, such as the infamous club Studio 54 in New York. What made these places and Disco groundbreaking, was the arrival of the very first continuous dance music: the genesis of the mix.
    
    Like many revolutionary genres, Disco was the outcome of a synergetic concurrence of events. On one hand, the use of 12” records for singles allowed deeper grooves, and therefore better sound quality and harder beats; a must for later House records. On the other hand, the end of the Vietnam War in 1975, marked a moment of joy despite the actual loss of the war by the US. Yet the people had every reason to celebrate. Their protest had won, not the whims of a war-mongering government they did not support. Disco celebration - the pressure release after a decade of counterculture and protest - was without limits. Colorful dresses, afro-wig haircuts, disco balls, glitter, glamour, loose-fitting legs: all typical Disco elements that became popular, especially during the more commercial period of Disco in the late seventies. Before this, Disco was a careful evolution of Funk (“Disco Roots”) in exclusive parties by professional producers/DJ’s such as Francis Grasso and David Mancuso, starting in 1972. A pivotal moment between these two types of Disco was the film release of “Saturday Night Fever” in 1977, after which not a living soul on earth did not know what Disco was.
    
    As one of the biggest mainstream hypes in the history of music, it is no surprise that Disco declined almost as fast as it peaked and that it sparked a wave of revulsion (symbolized by the infamous “Disco Sucks” tag). Although not without leaving a legacy of various Post-Disco genres and eventually what became known as “Disco’s Revenge”: House music.
  artists: ["Gloria Gaynor", "Rufus", "The Bee Gees", "Chic", "Boney M", "Rene & Angela", "The Trammps", "Patrick Hernandez", "Village People", "Sticky Fingers"]
  
- genre_id: "30.08"
  name: "Go-Go & Bounce Beat"
  description: |
    Go-Go is one of the smallest genres listed on the map. It can be seen as a subgenre of Funk, but a very distinctive one. By borrowing conga rhythms from Latin genres and putting more focus on percussion in general, Funk received a thriving tempo that seemed to never stop being on the move: it made the Funk go. This beating pulse could also be heard in Go-Go’s vocals. Go-Go is pretty straightforward Funk with little experimentation or technology. It stirred up as a popular bouncing fusion genre in Washington’s nightlife, where it remained a geographically isolated phenomenon. During the development of Old Skool Rap, Go-Go became more and more influenced by Hip-Hop, which is clearly audible in its funky breakbeats and uptempo lyrics. 
    
    In the 21st century, a subgenre or successor of Go-Go, Bounce Beat, reinvigorates Washington’s nightlife. Bounce Beat is a harder, harsher, more modern version of Go-Go with influences from EDM and less emphasis on melody.  Bounce Beat groups are numerous party crowds, creating a distinctive rhythm: a ceaseless pounding but in a restless manner.
  artists: ["Chuck Brown & the Soul Searchers", "Chuck Brown", "Rare Essence", "Experience Unlimited", "Blak Heat", "Junk Yard Band", "TCB", "Reaction", "XIB"]
  
- genre_id: "30.09"
  name: "Deep Funk/Rare Groove & Nu Funk"
  description: |
    Some may say that Funk is just Funk (which is hard to counter for fusion genres), but there is a difference between well known vocal (Early) Funk aimed at performing and the heavier, instrumental Funk focused on recording, known as Deep Funk. Although this genre already existed in the early seventies, the popularity of Disco pushed a number of artists underground during the eighties. Bass got stronger and breaks became more pronounced. The focus laid slightly less on fast drums and rolls but more on a slower tempo groove, pushing the music forward. Production was very raw and gritty like Southern Soul. Lots and lots of barely known artists brought out their own, more modern approach of their favorite genre, almost always on vinyl (particularly 45rpm singles). Although these records did get pressed, the number of editions was usually meager. These hard-to-find records (hence Rare Groove) were being hunted by Hip-hop, Acid Jazz, and Breakdance DJ’s everywhere (and still are). Rare Groove’s characteristics (heavy beats, instrumental, recording-focused, relatively unknown) make the genre ideal for sampling and extremely popular with Rap and Breakbeats artists.
    
    Starting in the nineties, a new wave of international artists created their own version of Deep Funk, dubbed “Nu-Funk”. Nu Funk uses often Latin or exotic influences and more electronic means to create the music, but otherwise it is very similar to classic Deep Funk.
  artists: ["Incredible Bongo Band", "The JB’s","The Mohawks","Rhythm Heritage","Marsha Hunt","Sir Joe Quarterman","Delta Rhythm Section","The New Mastersounds","Kraak & Smaak","The Bamboos","Fort Knox Fiveo"]
  
# - genre_id: "30.10"
#   name: "Boogie/Electrofunk"
#   year_emerged: 1984
#   description: |
#     The Influence from Funk on Electro bounced back to Funk, forging electronic Funk and keeping da Funk in the eighties alive. This genre has many different subforms but to prevent further pigeonholing, it is advisable to regard all these names as one and the same: Synth Funk, Dance-Funk, United Funk, Naked Funk, Electrofunk and (Electro) Boogie. Sometimes Funktronica is used as an alias of Boogie as well, but this is actually a different genre. It must be noted however, that Boogie already existed before Disco, but was still in its very infancy then and not regarded as a separate genre. (Electro) Boogie is quite the opposite of Rare Groove: digital, polished, and rarely instrumental. Instead of faceless DJ’s hammering on the perfect deep groove, colorful bands in glittering costumes gave it all they got to keep the crowd boogie all night long. In Electrofunk, all brass and Jazzy instruments are replaced by synthesizer (and electric guitar), and intensified by heavy use of vocoder vocals, which give the music a robotic sound, without losing the swinging groove; tha boogie. Boogie is the performance of Glam Rock, the ecstasy of Disco, and the sexiness of Funk all-in-one. Something that only the eighties would regard as not over-the-top.
#   artists: ["Zapp & Roger","Prince","Kool & The Gang","Cameo","Rick James","The Gap Band","Morris Day & The Time","Midnight Star","Earth, Wind & Fire","KC & the Sunshine Band","Imaginationn","D–Train"]
    
- genre_id: "30.11"
  name: "New Jack Swing/Swingbeat"
  year_emerged: 1987
  description: |
    Make no mistake, this genre has nothing to do with Swing. On the contrary, New Jack Swing (NJS) is the updated continuation of the Philadelphia Sound: the body of Philly Soul in a brand new jacket of Rap. Strong, funky breakbeats no longer form the rhythm for messages of protest or gangster lyrics, but for smooth, harmonic vocals talking about love and romance. Although many (male) New Jack Swing artists seemed like young, innocent casanovas, they often had hidden gangster habits, preluding an era of East Coast Gangsta Rap. Swingbeat (a synonym for NJS) is exactly the way it sounds: extremely catchy and funky with strong emphasis on beat.
    
    he TV-series “The Fresh Prince of Bel-Air” starring Will Smith knew how to bring New Jack Swing to a larger audience, featuring some of its songs alongside that particular late eighties New Jack Swing fashion: loose Hip-Hop wear with flashy colors, round sunglasses, female dreads or male hightop haircuts. But what makes this genre of particular gravity is the marriage of Rhythm ‘n Blues and Rap into Urban, a strong bond that has never fallen apart since.
    
    New Jack Swing evolves into Urban Soul, but sometimes overlaps with it as well. New Jack Swing was already known as Contemporary Soul or Urban Soul before the rise of the latter, after all. 
  artists: ["Wreckx-N-Effect","Bobby Brown","Boyz II Men","Abstrac","En Vogue","Guy","Today","Heavy D","SWV","Bell Biv Devoe","Soul II Soul"]
  
- genre_id: "30.12"
  name: "Neo Soul/Nu Soul"
  year_emerged: 1996
  description: |
    During the nineties, Rhythm ‘n’ Blues started to cross over to many other popular genres, combined with a lyrical tendency towards shallow and popular content. Slowly the term R&B becomes a vassal for major record labels to ensure their profits, with Swingbeat as the first, careful step. Independent artists responded with a return to pure, untainted Soul. Especially female ones joined the cause, as a reaction to new R&B’s sexist or superficial approach.  Compared to older styles of Soul, this “Nu Soul” was stripped down and simple: only one singer instead of vocal harmonies, and not too many instruments. Often there are influences from Jazz Rap or Progressive Rap, with whom it shares the desire to express proud and honorable black awareness.  Although Neo-Soul is inclined to a non-commercial stand, production is highly polished and its diva stars surely had little financial worries during the heydays.
    
    While Neo Soul has faded nowadays, a return to Soul of the sixties conquers more and more radio airspace in the nillies. This so called “Vintage Soul Revival” is barely a new genre, but it illustrates well how Soul has timeless and universal qualities. Very recently, new artists have blended Soul with Reggae, Rap, or Electro(-House) music into the catch-all genre “Future Soul”. It is still too early to define this genre, let alone assess its role in music history.
  artists: ["Lauryn Hill","Erykah Badu","Sade","Macy Gray","D’Angelo","Angie Stone","John Legend","Duffy","Amy Winehouse"]
  
- genre_id: "30.13"
  name: "Urban Soul/Pop"
  year_emerged: 1998
  description: |
    Urban Soul/R&B or the “new” R&B is so omnipresent that it’s often identified with the general term R&B, ignoring five decades of musical evolution. Out of the popular Rap/R&B hybrid of New Jack Swing, a new hybrid gradually unfolds, bursting to life in 1998: real Urban Soul or the first wave of Nu R&B. Female, predominantly black artists changed New Jack Swing’s uptempo Hip-Hop sound to a slower, Soul infused ballad (but still much faster than regular Soul). With their sugar-coated voices – often in harmony or slightly autotuned – they swooped a sense of sentimentality over their songs. A sense discredited with shallowness and capitalism: pure Pop music and little R&B. The lyrical content could hardly dismantle this prejudice. Corny, timeless love themes seem to be the basic premise. But Urban Soul is still a lot more R&B than its successor, Urban Breaks. String arrangements, soulful vocals, an absence of sexual promiscuity, and a connection with earlier Disco-/Dance-Pop are all real R&B/Soul elements of Nu R&B’s first wave that would eventually get discarded. 
    
    Although the genre might be considered formulaic Pop music and be partly despised for it, this simply proves that it succeeds in finding that perfect formula with Rap, Pop, and R&B ingredients which gets savored by the most.
  artists: ["Jennifer Lopez","Brandy & Monica","All Saints","Mariah Carey","Toni Braxton","Destiny’s Child","Aaliyah","Ja Rule ft. Ashanti","Anita Baker","TLC"]
  
  
- genre_id: "30.14"
  name: "Nu Disco & Funktronica" 
  year_emerged: 2007
  description: |
    Nu-Disco focuses specifically on (Post-)Disco of the late seventies and Eurodisco of the early eighties. This is Disco semi-detached from Soul, while harboring a stronger beat, which makes it more accessible for the modern public. Just like Electroclash brought back Synthpop to an EDM-fatigued audience, so reinstalls Nu-Disco (Euro-)Disco with similar success. Nu-Disco recreates these “old” genres by using the latest equipment and technologies. This allows razor-sharp productions and crystal clear sounds (especially Electro and Boogie sounds). Apart from this updated sound though, the difference with the original era is minimal. A point that is further being stressed by the use of “edits”: rereleases of old songs without any alterations.
    
    Funktronica emerges around the same time, and might be more or less interpreted as a Boogie Revival; a return of Synth Funk in the 21st century. Because Funktronica is influenced by Italo-Disco too, it shares much resemblance with Nu-Disco. Both genres signify a magical junction right in the center between Eurodisco, Chicago House and Electro Funk. After a long era of “cold” and “heartless” Electro-House, Nu-Disco and Funktronica become welcomed with open hands. From the moment the genre appeared on the website Beatport, along with its unknown DJ exponents, popularity kept increasing drastically: a possible omen that R&B’s Golden Age could return with a vengeance.
  artists: ["The Shapeshifters","Scissor Sisters","Justice","Dimitri From Paris","Lindstrøm","Eric Prydz]","Vitalic","Micha]el Gray","Chromeo","Big Gigantic","French Horn Rebellion"]
  


 
- genre_id: "31"
  name: "Blues"
  description: |
    Blues is almost as old as popular music itself. Its rich history streams through various genres, just like the Mississippi river carried musicians from Minneapolis to southern New Orleans. At first, Blues was dominantly associated with anything vice; it was regarded as the song of outlaws and criminals. But Blues must rather be seen as an outlet or cry for the people on the border of society: the poor, blind, unfortunate and particularly, the black. Blues before R&B was regrettably known as “race music”. Blues wins-over hearts because that’s where it comes from. It is sincere, but also blunt. No roses without thorns.
    
    Early Jazz and Ragtime were bound to the city as they needed bars and other band members to thrive. They also usually needed large instruments like string bass or piano. These genres were more formal types of music, performed in a professional manner and requiring an audience. Blues was none of this. Blues musicians could travel and play anywhere with or without anyone. They were (and often still are) lone wolves in pursuit of happiness. However, happiness didn’t always come along that easily. If their music didn’t catch on, they tried their luck with gambling and often ended up losing everything. Many Blues artists tried their luck in the city, though it required a certain resourcefulness to keep heads above water here. Rent parties, thrown by migrating Blues and Jazz artists alike in order to pay the rent, helped spread Blues rapidly across many US cities.
    
    Blues music (also known as Blue Music) is characterized by use of guitar, single at first and later complemented by drums and bass. Songs are written in an AAB rhyme, in harmonic sequences and onto a 12 bar 4/4 rhythm. Most recognizable about Blues is a progression of chords, in a call and response manner.  Chords also make use of blue notes: notes with an altered pitch. This gives Blues a typical melancholic, mournful sound, although for black musicians such connotation never existed.
    
    The word Blues was already part of English language in the nineteenth century, describing a state of delirium tremens or depression associated with chronic alcohol abuse. As early blues musicians were often lonely men with a tragic or criminal history, addicted to liquor and drugs (cocaine in the early days), “the blues” was an everyday part of their life. In these substances they sought a cure for their blues. In their music they sought atonement for their deeds. It is often said that Blues is the opposite of Gospel: that the latter is the music of God, where the former is the music of the Devil.
    
    The magnitude of Blues as a genre, has promoted a certain structural polarization: acoustic versus electric / modern versus classic / rural versus urban.  These pairs could have been separate super-genres, yet they are mere vague groups without clear boundaries. The rerelease of old 78rpm Blues records onto new 33rpm LP’s rejuvenated a strong interest in early acoustic Blues during the sixties; an interest that was further expanded by the popularity of acoustic Folk Rock. Alas, Blues was later pushed aside by its own children: Rock and R&B.
    
    Sometimes contemporary Blues is mentioned as a subcategory, but as a genre it doesn’t really exist. There are virtually no sources clarifying it, nor can a cohesive definition be constructed. This is a very strange phenomenon, suggesting that Blues itself is as good as dead, being the only super-genre that hasn’t spawned a new genre in more than twenty years. In a way, contemporary Blues can be seen as a broad umbrella genre for all latest Blues musicians who do not fit into another genre. Usually the music is quite smooth, a bit pop-like, with jazzy electric guitars and a strong Blues Rock influence. Contemporary Blues illustrates a restless kind of Blues: music that does not really know where to go nor fits in. This pushes Blues even more into the role that made it popular in the first place - Blues is the sound of the howling underdog.
    
- genre_id: "31.01"
  name: "Folk Blues, Country Blues, & Delta Blues"
  year_emerged: 1910
  description: |
    Country Blues means rural Blues; Blues far away from the city, at a time when there existed almost no popular music whatsoever. Country Blues did not evolve out of Country music: it was the other way around.  Therefore the only existing music besides Folk and Classical music at the time of Blues’s conception was Gospel. Almost automatically, Blues becomes the antithesis of Gospel. Wandering black singers who lost their faith due to misfortune slowly but steadily developed their personal, secular type of Gospel or more accurately: “badspel”, as there was little positive news for them to tell. At first they simply used (cheap) banjos, and later bottleneck guitars on which they liked to play blue notes while singing AAB verses. The music was very spontaneous and improvised: singers would play any chords and sing any lyrics that would come to mind, but often about tragic or depressing events.
    
    Folk or Country Blues has almost as many different subgenres as there are regions in southeastern US: Delta Blues, Acoustic Texas Blues, Memphis Blues, Atlanta Blues, Piedmont Blues, etc. <br>Delta Blues aka Mississippi Blues evolved around 1927 in the Mississippi Delta and remained a small but long-lasting subgenre. <br>Piedmont Blues encompasses different local Blues styles around the east coast (from Virginia to Atlanta) that exhibit a more Country-like sound. <br>And Hokum Blues is a very early and fast type of Blues with piano and two guitars where humor and innuendo play a great deal of importance: proto Boogie Woogie.
    
    Folk or Country Blues doesn’t die but keeps lingering as a parallel Blues stream, even when Classic Blues and Jazz start to build up momentum. The appeal of minimal, DIY, sincere Blues music ensures that many subgenres remain alive until this very day.
  artists: ["Blind Lemon Jefferson","Papa Charlie Jackson","Leadbelly","Sam 'Lightning' Hopkins","Robert Wilkins","Mississippi John Hurt","Blind Willie Walker","Charley Patton","Lonnie Johnson","Son House"]
  
- genre_id: "31.02"
  name: "Vaudville/Classic Blues"
  year_emerged: 1923
  description: |
    Classic Blues is not the first type of Blues, but the name can be explained by its feat as the first Blues genre to go on record (and thus one of the first recorded popular music in general). Also known as <v>Vocal</v> or Female Blues, Classic Blues is a whole different story than Country Blues. Under the influence of classy Jazz musicians, Blues was reshaped into an upper class phenomenon played in theaters in the big city, and therefore regarded as a sort of vanguard of urban blues (albeit completely different in form). Instead of freewheeling male rebels in shady bars, the music was performed by well-dressed female vocalists on stage during vaudevilles. These were professional divas already familiar with stage performance, and who turned their eye on Blues once it became popular, though they were accompanied by Jazz instruments.
    
    Vaudeville shows were adult-only, and often included sexually themed lyrics (in a very explicit manner). As Classic Blues formed an early link with Jazz, rural Country Blues evolved in the opposite direction and became rougher and more guitar-oriented. When Prohibition in the US ended, so did Classic Blues, paving the way for something less formal but equally bold: Boogie Woogie.
  artists: ["Mamie Smith","Lucille Hegamin","Bessie Smith","Ma Rainey","Lucille Bogan","Ida Cox","Alice Leslie Carter","Martha Copeland","Virginia Liston"]
  
- genre_id: "31.03"
  name: "Boogie Woogie/Piano Blues"
  year_emerged: 1928
  description: |
    Inspired by Ragtime music, Blues got introduced to the piano by the end of the twenties, forming Piano Blues but better known as Boogie Woogie. Similar to Ragtime, left hand provided a steady bass and the right hand provided the treble counterpoint.  The result was a very rhythmic, syncopated Blues, much more uptempo and happy than usual. The piano also made it possible to add a 4/4 beat, with accent on 2nd and 4th beat. Hence, Boogie Woogie introduced the backbeat into the world of music: a milestone of great significance. Boogie Woogie’s backbeat is called a shuffle, and it made people’s feet move everywhere.
    
    Boogie Woogie formed the ideal relief after the Great Depression and epitomized music removed of inhibition following the end of prohibition. As a post-depression natural muscle stimulant, Boogie Woogie rapidly became the drug of choice in the thirties, and it wouldn’t take long before “doing the boogie” was a common phrase for dancing to this hyperactive type of Blues.
    
    Of course, Boogie Woogie is or was often abbreviated to Boogie, but this is deliberately avoided here to not cause confusion with the other, unrelated genre Boogie. Another synonym for the genre – Barrelhouse Blues - is derived from a bar at the time where most of the music was played: a barrelhouse. In rather a “loose” atmosphere than a tight one, Barrelhouse Blues was extremely infectious. Of particular interest were the barrelhouses in New Orleans where Piano Blues evolved into New Orleans Blues during the forties, which laid one of the foundations for Funk.
  artists: ["Clarence Smith","Charles Davenport","Little Brother Montgomery","Pete Johnson","Roosevelt Sykes","Peetie Wheatstraw","Albert Ammons","Amos Milburn","Piano Red","Walter Roland"]
  
- genre_id: "31.04"
  name: "(Electric) Texas Blues"
  year_emerged: 1936
  description: |
    Texas Blues is one of the most important types of Country Blues. Like so many other genres, Texas Blues evolved from a strictly acoustic style to an electric one. The addition of electric guitars wouldn’t happen until the late forties, but this changed it into something else: proto Blues Rock. Blues suddenly sounded a lot more edgy, emotional, and rough; something that made up the core of Blues, but which it had lost along the way (with all the hyperactive, jazzy types of Blues). Because this modern approach ironically put Blues back in touch with its roots, electric guitars were suddenly found in all types of Blues, whether it was Delta, Texas, Memphis, Chicago, Detroit or whatnot. Strictly speaking, Electric Blues is therefore an umbrella term, but a very real and important one. (Electric) Texas Blues is characterized by exuberant showmanship; its musicians like to impress the audience with energetic solos and assertive performance. Despite its modest popularity, Texas Blues was of great influence to more modern Blues genres and the primary exponent of Country Blues.
  artists: ["Memphis Minnie","Texas Johnny Brown","Clarence Brown","Albert Collins","Freddie King","Pee Wee Crayton","Johnny Copeland","Lowell Fulson","Sam Myers & Anson Funderburgh"]
  
- genre_id: "31.05"
  name: "Jump Blues"
  year_emerged: 1940
  description: |
    The appeal of grand parties with a big band found its way to (Piano) Blues at the end of the thirties. More instruments were added to Piano Blues, especially brass (including saxophone) but also rhythm guitars. The result was a much larger band than usual with less focus on the singer: a combination of Jazz and Blues. Singers were forced to use as much volume as possible or combine their voices to drown out the band, which led to the concept of “shouters”. The audience reinforced the rhythm with abundant clapping accompanied by the piano. Jump Blues intensifies Boogie Woogie’s backbeat further to make a sort of “Dance Blues” or “Beat Blues”. Shouting, clapping, backbeat, big bands…: Jump Blues is unmistakably the most swinging, optimistic and humorous type of Blues, a large contrast with some other Blues genres.
    
    When the rest of the world was concerned with WWII, the East Coast of the US seemed to live in a happy bubble with this uptempo, bouncing, rolling, rumbling and tumbling music (and let's not forget jumping of course). But Jump Blues also became highly popular in the West Coast, where it was played at L.A.’s clubs and evolved into West Coast Blues.
    
    Jump Blues is proto Rhythm & Blues and therefore proto Rock ‘n’ Roll, which implies that it was simply too popular and catchy to be constrained within the family line of Blues. 
  artists: ["Louis Jordan","Wynonie Harris","Roy Brown","Big Joe Turner","Roy Milton","Jay McShann","Cab Calloway","Solid Senders","Jimmy Witherspoon"]
  
- genre_id: "31.06"
  name: "Chicago Blues/City Blues/Urban Blues"
  year_emerged: 1946
  description: |
    Chicago Blues has been around since the Great Depression. Slowly the genre developed during the thirties and forties, albeit in a much different way than what is usually referred to as Chicago Blues. What was originally a strictly acoustic, more reserved type of music, changed into a loud and angry son of a gun after World War II. Postwar urban migration skyrocketed in 1946 and brought different types of rural Country Blues together in the northern cities of the US (not only Chicago). Blues musicians from various backgrounds tried their luck in the big city, and ended up influencing each other. At first, the music was not that much different from Country Blues, but there was a spawning pool of talent where musicians could team up and learn from each other. Busy city neighborhoods and large house parties however, urged the need for louder music. The introduction of the electric guitar in the forties wasn’t just luck; it came right at the time it was most needed for the survival of urban Blues. Amplified harmonicas, drums, amplified guitars and loud, raunchy vocals suddenly gave Blues a heavily modernized sound.
    
    Sometimes Chicago Blues is further divided into West Side Blues and East Side Blues (the names are self-explicatory), but these are rather obscure genres. Chicago Blues ushered in a new age for Blues, and has been arguably the most influential type of Blues ever since. But the revolutionary sound takes only partly credit; fierce, raw, dynamic voices in vibrato give Chicago Blues a much more aggressive and darker appearance than other Blues, like a caged monster breaking free from its chains.
  artists: ["Muddy Waters","Howlin’ Wolf","Elmore James","Jimmy Reed","Junior Wells","Willie Dixon","Sonny Boy Williamson","Tampa Red","John Lee Hooker","Little Walter"]
  
- genre_id: "31.07"
  name: "West Coast Blues"
  year_emerged: 1956
  description: |
    East Coast Blues is the umbrella term for Piedmont Country Blues and Jump Blues, both more ‘jazzy’ types of Blues. Therefore it’s not really a well-defined genre, whereas West Coast Blues certainly is. A bit surprisingly, West Coast Blues is also very jazzy but not in a cool and relaxed way like East Coast Blues. West Coast Blues radiates a typically West Coast warm, delicate, and rhythmical aura. The genre is heavily based on the piano, yet also received influences from different genres of Blues (and of course West Coast Jazz) thanks to artists migrating to the west. The piano can be accompanied or replaced by a Blues guitar, but played in a jazzier manner. Just like East Coast Blues, West Coast favors technical sophistication and a certain finesse over unbridled emotion or introspective lyrics. It is Blues wrapped in a gentle blanket, with an unmistakably smoothened sound. Many night clubs favored this blanket: the lightweight sound never impedes intimate conversations, and lyrics are more politically correct than other forms of blues. Yet it remains true Blues, capable of piercing the heart once in a while. Similar to West Coast Jazz, it became the stereotypical background music for bluesy night bars, whether live or recorded.
  artists: ["T- Bone Walker","Amos Milburn","Pee Wee Crayton","Percy Mayfield","Lowell Fulson","Jesse Fuller","Ivory Joe Hunter","Charles Brown","J.J. Malone","L.C. Robinson"]
   
- genre_id: "31.08"
  name: "Louisiana Blues"
  year_emerged: 1959
  description: |
    Deep in the swamps of Louisiana, not only Country but also Blues was made. As one could expect, this was slow, plain, Country-like Blues. In this isolated and humid wilderness, Creole Folk music already existed long before Blues. One of the first types, (black) Cajun, mixed with Rhythm ‘n’ Blues into Zydeco, a French type of proto-Blues. Both Cajun (music) and Zydeco are known for their driving beat, dotted with harsher or unusual sounds like washboards.
    
    After some time, Zydeco evolved into Lousiana Blues, particularly in Baton Rouge, capital of Louisiana. The music became the soundtrack of the environment, which from that moment on would naturally be associated with rural, southern swamps: haunting echos and plenty reverb, cricket-like sounds, and slow, trembling guitars. The “swamp sound” was mostly dominated by accordion and harmonica, further enriching a stereotypical atmosphere associated with the music.
  artists: ["Lightnin’ Slim","Slim Harpo","Lazy Lester","Silas Hogan","Raful Neal","Snooks Eaglin","Lonesome Sundown","Rockin’ Sidney","Robert Pete Williams"]
   
- genre_id: "31.09"
  name: "Soul Blues"
  year_emerged: 1973
  description: |
    The decline of Soul (due to the rising popularity of other genres) was mourned by many. Especially the earliest type, Stax Soul, became the subject of grief, which golden days were already long gone by the late seventies. Poor black communities of the Southern states felt nostalgic about this rough, emotional and sometimes tragic music, to which they could relate more than than contemporary genres. As a part of the regional culture, Stax Soul got reinstituted but in the form of a crossover with Blues (making it even more emotional, and often melancholically sounding). It is nevertheless not incorrect to speak about a Southern Soul revival or a second wave, and perhaps even advisable to differentiate the genre from another type of Soul Blues. This other style  already existed in the fifties and is known as New Orleans Soul or New Orleans Blues, which was a strong influence on both Soul and Funk. New Orleans Blues – a first wave of Soul Blues – is a very emotional, melismatic type of Blues, often featuring falsetto vocals. Unsurprisingly this type of Soul Blues was quite similar to early Rhythm ‘n’ Blues.
  artists: ["BB King","Booker T & the MG’s","Otis Clay","Earl Gaines","Bobby Rush","Bobby Bland","Memphis Slim","Champion Jack Dupree"]
  
- genre_id: "31.10"
  name: "Hill Country Blues & Trance Blues"
  year_emerged: 1990
  description: |
    “Hill Country” refers to a specific region in Northeast Mississippi where a more radical style of Delta Blues was being developed, almost as old as Blues itself: Hill Country Blues. This style has no 12 bar rhythms, and is more riff and percussion based than other Country Blues styles. It can be a very pure, almost stripped type of Blues with classic instruments, sometimes only an acoustic guitar. This makes it reminiscent of Delta Blues but with a faster, highly rhythmic, repetitive tempo intensified by the punctuated, shivering sound of guitar or harmonica, guaranteed to entrance the listener or give one goose bumps.
    
    The hypnotic quality of Hill Country Blues was further extended in the nineties, due to experimental use of techniques atypical of Blues such as sampling, mixing or digitally creating. Hill Country Blues evolved into something else: Trance Blues. With the use of repetitive breakbeats or cut-and-paste sound loops, a continuous and eclectic style emerges that surprises the average Blues fan with a modernized sound.|
  artists: ["Fred McDowell", "Booker White", "Junior Kimbrough", "Bukka White", "Jessie Max Hemphill", "Robert Belfour", "R.L. Burnside", "Screamin’ Jay Hawkins", "Otis Taylor"]
   
- genre_id: "32"
  name: "Gospel"
  description: |
    The very first popular music genres came from a variety of influences but the foundations were laid in the United States. Before Blues and Jazz developed themselves, a number of “proto-genres” responsible for that development, were already known and popular throughout the country: Ragtime, Stride, Jug Bands, and Skiffle. But the most important one was Gospel. Gospel evolved from the fragile voice from black slaves into an undeniably huge genre with many subgenres. Gospel shakes off pretty fast its racial dimension: black and white join hand in hand to sing the song of God. Because Gospel is more about faith than about race; about believing in a better world and future and connecting different souls.<br><br>As Gospel expands and diversifies, questions are raised about the integrity of some artists and the music itself. Are some in it for the money or do they really speak the word of the Lord? Nowadays, Gospel is rarely a part of mainstream music media but without it, there would be no Rhythm ‘n’ Blues or perhaps even no popular music at all. However, in many churches and religious communities (especially in the southern part of the US) Gospel lives on strongly and is heavily produced, sung and experienced in sermons that induce ecstatic bliss in listeners, the likes other subcultures have never seen.<br><br>Though Gospel is already eclectic on its own, almost every popular music genre – from Rap to Metal – has been reshaped into a Gospel subgenre. Therefore a precise definition of Gospel in a broad sense is lacking, but the genre has some characteristics. Vocals for example, are usually sung in a “call-and-response” manner: a legacy from old church sermons, where the priest sings one part and the choir responds that same part. Not to create a cappella backbeat rhythm (although it was), but simply because of the fact that most church attendants were illiterate. Early Gospel only had piano accompaniment. Percussion was achieved by voice and handclapping. However, one should not underestimate the amount of rhythm achieved in traditional Gospel, another key characteristic of the music. Other pioneering popular music genres work with whatever set-up they could find or afford; easy to produce instruments like banjo or sometimes rudimentary tools such as washboards, kazoos, or jugs.  Modern or contemporary Gospel draws cues from any genre and therefore works with a whole variety of instruments.<br><br>The word “gospel” comes from two Old English words: “good” (which lost a vowel and became misinterpreted for the word God) and “spel”, which means a story or a message. Thus gospel is actually the same word as godspel or goodspel: fortunate news. This etymology is quite interesting, because it transcends Gospel’s religious (and narrow) dimension: the music is first and foremost a bringer of good news, no matter what faith one has: a herald of joy. And this is the power of Gospel: Gospel gathers people together, incites a sense of community, and inspires to do good, to bring good and to feel good.<br><br>Gospel is frequently forgotten as a super-genre in music genealogies, pushed away by bigger and more dominant families such as Blues, R&B, or Jazz. The collection of Gospel music is substantial though, with countless artists – even today – connected by their Christian faith. However, Gospel has taken on so many forms and styles that a common ground besides the message is sometimes hard to find. As the oldest popular music genre - the matriarch – it should be no wonder that Gospel has changed substantially throughout the years, but it has survived for more than a century: an accomplishment other genres still have to achieve.<br><br>
  
- genre_id: "32.01"
  name: "Traditional Gospel"
  year_emerged: 1880
  description: |
    Between 1880 and 1930, Gospel slowly evolved from small, flickering Spirituals to a bright, popular flame, sung and known by many American people, <b>both black and white</b>, but all <b>fundamentally Christian</b>. Gospel started as <b>emotional church hymns</b>, with a <b>call and response choir</b>. This means that one part of the choir sings a part and the other responds in a different key (harmonizing). This <b>alternating play of chords with unusual intervals</b> would become an important trademark in a lot of popular music. Early or Traditional Gospel (sometimes known as <b>Jubilee</b>) is mostly music performed by <b>barbershop quartets</b>. But after Ragtime, it received accompaniment by a <b>piano</b>. Because there were almost no instruments, the lyrics were obviously important, talking about nothing but <b>good news, hope, and bliss</b>. At the turn of the century, the first Gospel composition was created. By 1920 the term “Gospel songs” was first used, and they were practiced in <b>rural, southern America</b> by both black and white people (albeit in slightly different forms). The black form of this “<b>Southern Gospel</b>” evolved by 1930 into what is known as “<b>Black Gospel</b>”. By this time Gospel was a well established music genre, with real artists instead of enthusiasts.
  artists: ["Mahalia Jackson","Thomas A. Dorsy","Fisk Jubilee Singers","Golden Gate Quartet","The Sallie Martin Singers","Willie Mae Ford Smith","The Stamps Quartet","The Blackwood Brothers","Rev. C.L. Franklin"]
   
- genre_id: "32.02"
  name: "Modern Gospel"
  year_emerged: 1947
  description: |
    After World War II, Gospel changes dramatically, which is why it’s being marked as a different genre, though in many music genealogies, this is not the case. <b>Record labels, radio stations, and promoters</b> get interested in the music, as religiously themed music is <b>commercially</b> a more than viable path. This Modern or <b>Progressive Gospel</b> differs from Traditional Gospel in a clear and present <b>influence from Blues</b> and especially early <b>Rhythm ‘n’ Blues</b>. Although instrumentation is scarce (often a <b>single piano or guitar or both</b>), a <b>strong beat</b> surfaces through <b>full chords or hand claps</b>. Sometimes a floor mounted pedal steel guitar is being used, giving name to the subgenre “<b>Sacred Steel</b>”. But Modern Gospel is not about the instruments, but about the voice and message of God. Sung by <b>Barbershop quartets</b> or strong <b>diva</b> mezzo-sopranos, the number of dominantly black Gospel artists (especially <b>women</b>) rose exponentially in the fifties and <b>large Gospel concerts</b> start to take hold. This gives a nationwide sense of <b>black awareness</b>: Modern Gospel becomes the<b> herald of Soul</b> music; a feat beyond comparison. Nevertheless, the influence of “the Devil’s music” Blues starts to <b>outrage</b> certain Gospel fans. The rising fondness for money and fame from artists who started out with nothing accept their faith, accumulates to a growing aversion for what is pejoratively called <b>secular</b> Gospel.
  artists: ["Soul Stirrers","The Harmonizing Four","Dixie Hummingbirds","Jessy Dixon","Marie Knight","Pilgrim Travelers","Brother Joe May","Original Gospel Harmonettes"]

- genre_id: "33"
  name: "Jazz"
  description: |
    Jazz is music performed by an ensemble of players, each (very) specialized and proficient in their respective instrument. The usual Jazz instruments are: trumpets, saxophones, clarinets, trombones, string-bass, and piano alongside drums and a jazz-guitar. The interaction between these players is crucial. Compared to Rock or Blues, Jazz musicians follow no completely predetermined scores. They have to “feel” what the others are about to play and how the music will evolve. Yes, there are chords and melodies forming an identifiable foundation for each song, but improvisation and instantaneous experimentation are never absent. In a way, true Jazz music can only be experienced live. Each performance is supposed to be different. Jazz therefore is part of a thriving nightlife subculture in (Jazz) bars all over the world. The difficult aspect of improvisation probably explains why Jazz of all the super-genres is the most (if not always) instrumental, experiments the least with sound effects and plays more with structure, patterns and rhythms, reminding us a lot of Classical Music.<br><br>Jazz provides an interesting combination of (lower class) African American folk music with (upper class) European amusement and classical music. As such, Jazz has never been as racially defined as Blues is and is undoubtedly laudable for bonding these subcultures. Jazz ensembles are divided in different sections: the rhythm section (bass, drums, and piano) provide a steady beat throughout the track, while the melody section (horns) plays the chorus altogether and afterwards separately with solo’s.
    The precise origin of the word Jazz has been lost over the course of time. Three possible explanations exist, though none of them might actually be the truth. One suggests that the word is black slang for the ensemble. Another hypotheses tells us that its roots lie in an early Jazz band named “Razz” or an early musician named “Jazbo”. Or the name might also be slang for “Jasmine”, the most common perfume for prostitutes working in early twentieth century brothels (where Ragtime and Jazz developed).<br><br>The power of Jazz lies in its rich contrast: improvised versus predetermination, chaos versus control and light and gentle sounds versus sharp and shrill tones. Jazz is also unique in influencing many genres in a subtle manner. Although there are no immediate derivative genres coming from Jazz, countless ones have been influenced by it. Its unique concepts and instrumentation are versatile enough to transfer to the most diametrical of popular music genres.<br><br>Over the course of history, there have been attempts to divide Jazz into a small number of categories, which could have been super-genres in their own right. Names such as “Traditional or Post-Jazz”, “First, Second and Third Stream (Jazz)” have been viable options at one time or another, but hold barely any relevance in today’s styles of Jazz.  One possible way to structure this whole is by using two pivotal moments - the birth of Bebop and Fusion - to divide the whole into three time periods: Classic Jazz, Modern Jazz and Post-Jazz (aka Post-Fusion or Free-Bop).<br><br>In the mid-seventies Jazz gets strongly repressed and overshadowed by R&B. Many American Jazz musicians migrate to Europe, where funded Jazz festivals and Jazz bars in historical city centres thrive better than in the States (particularly in Scandinavia and Eastern Europe).  Currently, American Jazz education is on the rise, but general public interest has stayed off. Post-Jazz has therefore become a global and heavily dispersed phenomenon of a genre that once was the sound of a nation.

- genre_id: "33.01"
  name: "New Orleans & Dixieland Jazz"
  year_emerged: 1915
  description: |
    The very first type of Jazz was played in the <b>background</b> of <b>bars</b> (barrelhouses), <b>brothels</b>, and <b>cabarets</b> by a small band. It first appeared in New Orleans thanks to the <b>melting pot</b> present of Ragtime, Haïtian Folk, Creole Folk and Country Blues. New Orleans was not only home to <b>Dixieland marching bands </b>and a main port for <b>sea travel with Cuba</b>, but a former <b>French colony</b> as well. Cuban music, French music, and marching bands all heavily influenced Jazz, making it one of the most diverse musical stews. <br><br>The music was not rough and emotional like Blues, but <b>balanced</b> and <b>reserved</b>. The basic instrument ensemble for New Orleans Jazz is trumpet, clarinet and trombone; a very modest but complementary trio, filling all frequencies and improvising around each other. No instrument dominates: they all communicate and play out their melodies at each other in a <b>counterpoint</b> manner. The technique of counterpoint came into Jazz through Cuban <b>Contradanza</b> (or Habanera) music, which in turn came from French Contredanse. All three instruments also <b>improvise collectively</b> instead of separately, an important difference with later Jazz. Improvisation and experimentation were common in Jazz and stimulated by frequent <b>marihuana</b> use, as the drug was still legal in the U.S. during the 1910s and 1920s. <br><br>After a while, Jazz bands <b>expanded</b> and became performed by <b>white artists</b>, leading to a slightly different sound (more instruments) which is known as Dixieland Jazz, though the difference is negligible. 
  artists: ["King Oliver's Creole Jazz Band", "Original Dixieland Jazz Band", "King Oliver", "Louis Armstrong"]
  
- genre_id: "33.02"
  name: "Ragtime"
  year_emerged: 1890
  description: |
    Ragtime is a peculiar genre unlike anything else listed on the Carta and an important pioneer of Blues and (especially) Jazz, forming a sort of link between popular and earlier non-popular music. At the end of the nineteenth century we see this music, inspired by <b>European brass</b> bands, French <b>contredanse</b> and <b>banjo dance</b> music, emerging in any <b>saloon, bar, or bordello</b> in the United States that harbored a <b>piano</b>. Ironically Ragtime is the complete opposite of the stereotypical far-west or southern US brothel image: <b>disciplined, structured and calm</b>. Only one person and a piano form this genre. The song structure varies a lot, but is completely written out with no room for improvisation. <b>One hand</b> plays the <b>melody</b>, while the <b>other</b> plays the (also changing) <b>bassline</b>, which creates a certain tension between melody and bass. The name is derived from the earliest examples of these “broken” rhythmic songs, known as “rags”. Remarkably, a revival of Ragtime appeared almost a century later in the seventies.<br><br>In the early twenties Ragtime evolves into Stride which allows for more <b>improvisation and showmanship</b>. Ragtime and Stride own a lot of their popularity to <b>Foxtrot</b>: a popular dance that emerged in the 1910s.
  artists: ["Scott Joplin", "Tom Turpin", "Eubie Blake", "James Scott", "Joseph Lamb","Thomas Fats Waller","Willie the Lion Smith","James P. Johnson","Arthur Collins", "Bunk Johnson", "Preservation Hall Jazz Band"]

- genre_id: "33.03"
  name: "Chicago Jazz"
  year_emerged: 1926
  description: |
    During America’s period of prohibition, Chicago became a very popular <b>transportation hub</b>, connecting various parts across the country. As the first true “<b>city Jazz</b>”, Chicago Jazz influenced (and got influenced by) many musicians, also Blues artists. Its importance however is rather modest compared to Chicago Blues. Where the <b>Windy City</b> proved beneficial in bringing different regional styles of Blues together, the upside for Jazz was more superficial as Jazz started primarily in one region. However, Chicago provided the possibility for numerous <b>young white artists</b> to come in contact with this unknown black music and alter it to a more <b>“European” sound</b>. Chicago Jazz has more <b>changes in composition</b>, includes <b>harmonies</b> and is <b>densely textured</b> with <b>many solos</b>. While the music became more convoluted, it also received a “windy” overhaul, with <b>cold, harsh and grouching sounds</b>, fitting for Chicago’s climate. The latter aspect has given Chicago Jazz the alias “<b>Hardcore Jazz</b>”. The genre remained somewhat popular, due to its stereotypical sound that combines the <b>hyperkinetic</b> with the <b>lunatic</b>. Because it is also one of the oldest Jazz genres, recordings are very <b>lo-fi</b>, adding to an already <b>comical nature </b>of Chicago Jazz, and often used much later in cartoons or slapstick films. Ironically there was no humor at the base of Chicago Jazz, only the unbridled ambition of white youngsters.
  artists: ["Max Kaminsky","Joe Sullivan","Bud Freeman’s Windy City Five","Miff Mole & His Molers","Eddie Condon","Muggsy Spanier","Jelly Roll Morton","Jimmy MacPartland","E.C. Cobb & His Corn-Eaters"]


- genre_id: "33.04"
  name: "Swing"
  year_emerged: 1930
  description: |
    The gradual expansion of Jazz bands synergized with an increasing demand for <b>escapist music</b> during the thirties. After all, the world had just experienced its biggest <b>financial crisis</b> ever, where suicide was not out of the ordinary. Sheltering in the frivolous yet deafening sound of Big Band Jazz, man and woman, <b>black and white alike</b>, gathered in parties to deny the cold reality outside and experience this new craze: Swing. <br><br>Swing started with Jazz bands of ten instruments, but soon <b>orchestras of 17 instruments</b> became the standard; one can see that the phrase “big band” is not exaggerated. The setup consists of <b>more reed and less brass</b> instruments. <b>String basses</b> are also added. The music is very <b>catchy</b>, with call and response tunes, <b>hooky riffs</b>, and a 4/4 beat that makes it hard to stand still. Swing songs are <b>highly structured</b> compared to other Jazz. First the melody is played by all instruments. Then comes the vocal part with solos after which the chorus comes, consisting mostly of high notes.<br><br>The music was accompanied by its own dance, also called “Swing” or “<b>swinging</b>”, which has remained popular ever since. Related dances, such as<b> Lindy Hop</b>, were (and are) also commonly applied to Big Band Jazz. Remarkably, Swing became <b>revived during the Second World War</b> for an even greater moment of escapism. While enemy forces were bombarding the outskirts of the city, people partied and danced their worries away on the tunes of Swing, which could only be described as a Kafkaesque spectacle.
  artists: ["Benny Goodman","Count Basie","Duke Ellington","Fletcher Henderson","Gene Krupa","Chick Webb & His Orchestra","Jimmie Lunceford","Claude Thornhill","John Kirby Sextet"]

- genre_id: "33.05"
  name: "Progressive Jazz & Model Jazz"
  year_emerged: 1937
  description: |
    The whole of Jazz music is sometimes divided into three categories or “<b>streams</b>”: First there was <b>Traditional Jazz</b> (quite formal) which could be seen as the opposite of the experimental, second stream: <b>Modern Jazz</b>. The <b>third stream</b> was reserved for the type of Jazz that was neither, but a <b>merging between Classical Music</b> (particularly Chamber music) <b>and Jazz</b>.<br><br>Experimentations between these two genres existed long before Modern Jazz, so it wasn’t until 1957 that composer Gunther Schuller coined this <b>ambiguous term</b>. The <b>quest for coexistence</b> between classical music and a popular genre that was partly defined in its non-classical properties (such as improvisation) proved to be a slippery slope. Third Stream Jazz is certainly not a strong subcultural movement, but more a<b> collection of experimental Jazz songs</b> over the course of time. Obviously Third Stream songs are more <b>intricate</b> with <b>longer and deeper progression</b> (thus “Progressive Jazz’) than other types of Jazz, but when the avant-garde of the sixties invented Free Jazz, Third Stream’s relevance shrunk to absolute zero. Now, classical composers could learn more from Jazz than the other way around.<br><br>As a response, Third Stream’s definition was broadened to include<b> crossovers to World Music</b>, yet it remains one of the lesser known Jazz genres. A different successor at the end of the fifties, <b>Modal Jazz</b>, improvises on a series of scales instead of chords. Like the “Math Rock of Jazz”, Modal Jazz is defined (solely) by its highly technical, rational and mathematical structure.
  artists: ["Bill Russo","Gunther Schuller","George Russell","Eric Dolphy & John Lewis","Modern Jazz Quartet","Paul Whiteman","Charles Tolliver","The Gil Evans Orchestra","Stan Kenton"]
  

  
- genre_id: "33.07"
  name: "Bebop"
  year_emerged: 1945
  description: |
    Genres that grow too big eventually will fall. This was no different with Swing. Not only became it difficult to maintain such large, expensive orchestras, but more and more white people were copying the music. Though Jazz had always been less racially restricted than Blues, a number of black Jazz musicians felt a need to redefine <b>black Jazz culture</b> with a new, radical genre: Bebop. Their dissatisfaction is reflected in Bebop’s trademarks: <b>frantic, chaotic and aggressive</b>.<br><br>Bebop (or simply “Bop”) is one of the most <b>revolutionary</b> types of Jazz (and music). Why? Because it makes the music <b>faster by making it slower</b>. How? By stretching (thus slowing down) the tempo, a lot of <b>silent gaps</b> opened up between the beats. This free space could be filled in freely (<b>improvised</b>) with drum <b>rolls</b>, rhythmic <b>breaks</b> and <b>superfast, harmonic melodies</b>, usually in <b>vibrato</b>. Musicians also regularly imitate trumpet solos with their voice, leading to a new, fast singing technique called “<b>scatting</b>”. The word “bebop” itself comes from scatting, as it is as an often used <b>onomatopoeia</b>. The difference between Jazz from the past was so huge, that people eventually coined the term “<b>Modern Jazz</b>”, which later also included other experimental genres such as Hard Bop and Free Jazz.<br><br>Many wannabe Bebop musicians went downhill because they wrongly believed that <b>heroin</b>, which was very cheap during the forties, was an inherent part of Jazz culture. Their <b>personal</b> but also <b>social problems</b> (racism) illustrate the dark side of Bebop. This was no happy music, but the psychotic screams of struggling musicians, who didn’t care whether you loved or hated their music. <br><br>Around 1982, Bebop experiences a strong revival known as <b>Neobop</b> (or sometimes called Neo-Con (= conservative) Jazz). A lot of <b>young</b> Jazz <b>scholars</b> were not interested in the new possibilities of Fusion, and chose to concentrate on the old school (with influences from Free and Modal Jazz):<b> straight, acoustic Jazz</b> but <b>rich</b> and <b>vibrant</b>. A type of Jazz where they could show off their <b>technical skills</b> that would otherwise have been masked by the eclecticism of Fusion.
  artists: ["Dizzy Gillespiea","Charlie Parker","Thelonious Monk","Dexter Gordon","Kenny Clarke Group","Max Roach","Fats Navarro","Roy Haynes Trio","Babs Gonzales"]

- genre_id: "33.08"
  name: "Cool Jazz & West Coast Jazz"
  year_emerged: 1950
  description: |
    Cool Jazz is an evolution of Bebop, where the music is approached in a more <b>rational, reserved and calculated </b>manner: <b>in a “cool way”</b>. “Keeping cool” was an important part of the spirit of the fifties, after all. Cool Jazz <b>emphasizes sound</b>, trying to make each note as <b>crisp and clean</b> as possible by providing <b>high contrast</b> in frequency and tempo between its different sections. The use of <b>counterpoint</b> is common as well. Furthermore, the autonomy of notes is being stressed through <b>solos</b> (often many different solos at the same time). Overall, the genre appears as a <b>lightweight and relaxed</b> form of Jazz, yet heavily structured and complex, reminding of <b>Classical</b> music (which was a big source of inspiration).  The perfect habitat for this <b>smooth, calm type of Bebop</b> is the laidback <b>west coast of the US</b>, which developed its own type of “Cool”: West Coast Jazz. Cool Jazz is mostly performed by white artists, with more influences from “white music” such as classical music. The genre experienced an early demise, lacking the passion and emotion of other (black) Jazz genres. Be that as it may, Cool Jazz remains the stereotypical background music for <b>sophisticated jazz bars</b> where intellectuals hold philosophical conversations till the wee hours of the morning.
    artists: ["Dave Brubeck","Chet Baker","Stan Getz","Claude Tornhill","Modern Jazz Quartet","Stan Kenton","Mel Lewis Septet","Chico Hamilton","Gerry Mulligan"]
    
- genre_id: "33.09"
  name: "Hard Bop"
  year_emerged: 1953
  description: |
    In an attempt to take back Jazz listeners that had turned to R&B, many (east coast) Bebop musicians changed their sound into something more accessible: Hardbop. Hardbop is a more <b>modern evolution of Bebop</b>, but not particularly “harder”, despite the term. The music is <b>smoothened out</b> and more <b>emphasis</b> is being put <b>on the rhythm</b>. The “Cool School” of the west coast had also provoked a certain disdain by Bebop players, with its exaggerated rationalism and lack of pathos. Hardbop formed the <b>emotional answer</b> but it in a very<b> basic and gentle</b> manner and not chaotic at all. Alongside these influences, the arrival of <b>longplay records</b> (at 33rpm) allowed for longer songs and longer solos. Numerous <b>alternating solos and chords</b> (of different instruments, sometimes even bass and drums) are being played in a <b>call and response manner</b>. Hardbop is played by small ensembles and is often described as heaving a more “bodied” or “textured” sound. Since its inception, Hardbop has been the <b>dominant genre</b> in Jazz. When Jazz is performed in Jazz bars or performances, it is highly likely to be Hardbop. There are two Hardbop subgenres: <b>Funky Jazz</b> (simple, with bluesy sound) and <b>Mainstream Hardbop</b> (more complex, closer related to Bebop).
  artists: ["Horace Silver","John Coltrane","Art Blakey & Jazz Messengers","Wes Montgomery","Charles Mingus","Art Farmer","The Cannonball Adderley Quintet","Lee Morgan","Sonny Rollins"]
    
- genre_id: "33.10"
  name: "Soul Jazz/Jazz Funk"
  year_emerged: 1957
  description: |
    Soul Jazz is one of the smallest genres of Jazz. In fact it can be seen as an overlapping <b>subgenre of Hard Bop</b>. Its influence is extremely important however, leading directly to <b>Funk</b> (hence the alias Jazz Funk). As an <b>eclectic</b>, heavily <b>R&B-influenced</b> type of Jazz, it’s sometimes very hard to separate Soul Jazz from Fusion or Soul Blues, especially later recordings. Soul Jazz is music for a <b>small Bebop band</b>, with the addition of more rare Jazz instruments such as <b>(Hammond) organs and tenor saxophones</b>. These instruments create a <b>thematic, smooth, relaxing</b> sound that indulges the listener in a feeling of warmth and comfort. <br><br>Soul Jazz was created for a <b>young, urban target audience</b> that felt less connected with the more complex and chaotic styles of Jazz. The plain, <b>downtempo, rhythmic melodies</b> were easy to get into. Likewise was a continuous, <b>repetitive bassline</b> on the foreground, like a primitive version of the Funk groove. But most importantly is Jazz Funk’s credit as a forerunner of <b>black civil rights</b> in the US, alongside Modern Gospel. The alarming amount of white artists within West Coast Jazz circles, created a backlash of black artists taking up Jazz careers.
  artists: ["Bobbi Humphrey","Canonball Adderley Quintet","Jimmy Smith","Lou Donaldson","Horace Silver","Richard Holmes","Stanley Turtentine","Shirley Scott","The Headhunters","Grover Washington Jr."]

- genre_id: "33.11"
  name: "Fusion/Jazz Rock"
  year_emerged: 1970
  description: |
    Acoustic traditional Jazz (also called Straight Jazz) reached its saturation point at the end of the sixties: due to its experimental nature almost every genre was already invented. Jazz had to <b>cross over into</b> the territories of the hottest music of the time: <b>Funk</b> for example, but mainly <b>Rock</b>. This powerful reinvention became so popular and well-spread, with many derivative genres, that it simply was called “<b>Fusion</b>”, although Jazz Rock is also a correct term. Fusion fuses traditional Jazz melody and rhythm and Jazz elements such as <b>improvisation and complex interplay</b> with <b>Rock instruments</b> (electric guitars, basses, synth), amplification, and <b>simple harmonies</b>. <br><br>The main structure was <b>similar to Free Jazz</b>, as once again, Fusion was invented by Miles Davis (who invented four different Jazz genres throughout his career). Rock influences came mostly from Acid Rock, although Fusion artists were also interested in Progressive Rock and during the seventies, there was quite some overlapping between Prog Rock of that time and Fusion. Jazz Rock marked the end of a Jazz Era (Modern Jazz) and the beginning of a new one (<b>electronic Jazz</b> or Post-Jazz).
  artists: ["Miles Davis","Herbie Hancock","Weather Report","Billy Cobham","Return to Forever","The Tony Williams Lifetime","Mahavishnu Orchestra","Stanley Clarke","Chick Corea"]

- genre_id: "33.12"
  name: "Smooth Jazz"
  year_emerged: 1975
  description: |
    The Jazz era after Fusion - also known as <b>Post-Fusion</b>, Post-Jazz, or Freebop – had to deal with the growing popularity and commercial approach of R&B, particularly Disco. As such, an offshoot of Fusion known as Smooth Jazz, became the favorite <b>puppet of</b> Jazz-related <b>record companies</b>, more profit-fixated than before. Experimentality became replaced by <b>radio friendly</b>, easy-listening music. Smooth Jazz aka <b>Pop Jazz</b> is supposed to sell - en large - with a slick, heavily<b> produced and</b> of course <b>smooth sound</b>. Jazz’s commercial direction is a striking part of the seventies “me generation”, where capitalist yuppies replaced naïve hippes. Of all different Jazz genres, it’s one of the <b>plainest</b>, with only <b>one or two instruments</b> playing melodies. Often there’s a <b>saxophone</b>, which is characteristic for Smooth Jazz’s (unintentional) <b>erotic connotation</b>: the music genre was a staple in erotic films or scenes during the late seventies and early eighties. After this period, Smooth Jazz also sparked reinterest in soft Pop music and paved the way for New Adult Contemporary (N.A.C). Critics, especially fans of classic and complex Jazz genres like Bop, describe Smooth Jazz as <b>cheesy and predictable</b>. Derogatory genre names like “<b>Fuzak</b>” and “<b>Hot Tub Jazz</b>” (New Age Jazz) reassert their opinions, while also holding a certain ground.  After all, Smooth Jazz is often catered as <b>background music</b> for bars or restaurants or just to relax at home. Be that as it may, its overall popularity is still significant, because it delivers exactly what it promises: <b>Easy-Listening</b>.
  artists: ["Kenny G","George Benson","Yellowjackets","Larry Carlton","Spyro Gyra","Dave Grusin","David Sanborn","Rippingtons","Najeee","Candy Dulfer ft. Dave Stewart"]
  
- genre_id: "33.13"
  name: "Acid Jazz"
  year_emerged: 1988
  description: |
    Acid Jazz is a crossover genre gone too far: there is barely any Jazz left in it. There’s actually almost zero ‘acid’ about it as well, except a slight <b>psychedelic</b> sound, placing it high on the chart for poorly chosen genre names. In fact it’s more of the deepest funky Fusion combined with Rap, so <b>Fusion Rap</b> would be more appropriate. But the name is no error: Acid Jazz was a deliberate and <b>firm reaction</b> from the British Soul scene <b>against</b> the fiddling “nonsense” of<b> Acid House</b>. The leading record label – also named Acid Jazz – was determined to compensate Acid House with what they regarded as “quality music”, heavily influenced by <b>Rare Groove records</b>. <br><br>A steady Hip-Hop <b>breakbeat</b>, lots of <b>percussion</b>, Jazz harmonies and funky basslines (often with the aid of a synthesizer) are the key flavors of Acid Jazz. These elements blend perfectly until the <b>roots</b> of the genre are <b>no longer traceable</b>. It was a short but popular <b>craze</b>, right before EDM conquered the music scene. Due to its highly danceable nature, a new type of dance, <b>Jazzdance</b>, was invented along with it (which became more or less a synonym of the music itself). It can be hard to separate Acid Jazz from Jazz Funk with heavy breaks, if it wasn’t for the (abundant) use of <b>vocals</b>.
  artists: ["The Brand New Heavies","Stereo MC’s","Jamiroquai","James Taylor Quartet","Groove Collective","Galliano","M-People","US3","Incognito","Max Sedgley"]


- genre_id: "33.14"
  name: "Nu Jazz/Electro Jazz"
  year_emerged: 1995
  description: |
    During summer afternoons or evenings, in <b>picturesque</b> metropolitan <b>suburbs</b> (such as Saint-Germain, Paris), Nu-Jazz would be the ideal <b>background music</b> for any café terrace or coffee bar. It is electronic, <b>melodic, playful Jazz</b> with lots of <b>soothing, ambient</b> sound effects that wash over the gentle Jazz percussion like a warm summer breeze. Being made <b>entirely electronic</b>, it marked the end of the traditional Jazz band. All Jazz music from Nu-Jazz and forward – dominantly electronic and often home produced like EDM – is conjoined under the portmanteau “<b>Future Jazz</b>”. Future Jazz succeeded where contemporary Blues failed: renewing Jazz in the 21st century.<br><br>Nu Jazz, also known as <b>Jazztronica, Phusion</b> or Electro Jazz, can have a broad range of influences, such as <b>deep basses</b> from Ambient House or Deep House, <b>groovy drum rhythms</b> from Breakbeat, and exotic percussion from Latin genres. This makes Nu-Jazz a core genre (or the) of the second or <b>electronic wave of Lounge</b>, and it’s easily mistaken for Broken Beats or other Lounge genres. But these influences are subtle enough to not masquerade the fact that it truly is Jazz. Nevertheless, Nu-Jazz differs radically from older Jazz genres in means of production (<b>solo and recorded</b> versus live and in band) and its electronic sound. Hence, most Jazz enthusiasts regard Nu-Jazz rather as a rupture instead of a continuation within Jazz and encourage its classification among non-Jazz genres (Lounge, House, Breakbeat, Downtempo…). But in the realm of music, tradition is a bad advisor for survival.
  artists: ["Saint-Germain","Jazzanova","Llorca","De-Phazz","Trüby Trio","Alex Kid","DJ Cam Quartet","Marc Moulin","Grand Tourism ft. Terry Callier"]
  
  
- genre_id: "33.15"
  name: "Original Afrobeat"
  year_emerged: 1960
  description: |
    Afrobeat is a dynamic West African music genre pioneered by Fela Kuti that blends traditional Yoruba rhythms, highlife, and jazz with American funk and soul. Key artists in this tradition include Femi Kuti, Seun Kuti, and Antibalas.Genre DescriptionCore Sound: Combines heavy, infectious funk grooves, intricate percussion, jazz horns, and chanting vocals.Song Structure: Features long-form tracks (often 10 to 30 minutes) that start with a slow-building instrumental jam before vocals and explosive horn solos enter.Large Orchestras: Uses massive bands with multiple guitarists, bassists, drummers, and a large horn section.Political Message: Built on strong, critical anti-corruption and pro-African political lyrics.
    
    It is important not to confuse this with Afrobeats (with an s), which is a less folk-focused and more modern/hip-hop sounding genre.
    
  artists: ["Femi Kuti", "Antibalas", "Tony Allen"]


- genre_id: "34"
  name: "Caribbean & Afrobeats"
  description: |
    Jamaican music is regrettably often reduced to its most popular export Reggae. Reggae’s international appeal quickly surpassed the threshold which defines world music. This becomes very clear when compared to the music of neighbouring countries like Cuba and Haiti. But there are more Jamaican music genres that all have become more popular than world music. What is even more important than their popularity is the fact that Jamaican music creates a critical shackle between Rock, Rap and Dance. Almost all Jamaican music genres share certain characteristics which not only give them a very distinguishable sound but also explain the tremendous influence on other genres, particularly British ones. As Jamaica used to be a British colony until 1962 (which is after the rise of Ska), the import of Jamaican music into the UK has always been thriving (like the cargos from the infamous Trojan record label for example).<br><br>Jamaica had no radio stations at all let alone music television. The only way for Jamaican public to enjoy music they didn’t have to buy themselves, was by attending local “sound systems”: very large, mobile stereo systems with different types of speakers and turntables. To supply these sound systems with records, there were recording studios everywhere.  Therefore, Jamaican music is focused on recording, not performing. Live gigs were virtually non-existent and vinyl reigned supreme.  It is no wonder that many pioneering recording and loudspeaker techniques were invented in Jamaica. Because of sound systems, Jamaican music is made to be played outdoors (with the exception of Dancehall). This is particularly noticeable in the dedication (mainly amplification) on the drum and bass parts. Unsurprisingly, Jamaican music has always been extremely popular at festivals abroad, which helped Jamaican music popularity move forward.<br><br>The Jamaican culture of record producing and spontaneous sound systems has been around as long as the music itself, i.e. even as early as Mento.  This means that Jamaica also introduced the concept of the DJ long before Eurodisco and EDM. The “Disk Jockey” or record player is known as the “Selecta” or selector. The DJ works together with the “MC” or “Master of Ceremony”, who does the “toasting”: Jamaican slang for adding live vocals. The MC also provides “peps”, which are speedy vocals in a Jamaican dialect (that may sound like gibberish) to pep up the crowd, later annexed by Drum ‘n’ Bass. In the beginning the Selector and the MC was one and the same person, but as these two occupations became separated from each other, their respective responsibility increased. Sound systems expanded as well, evolving in more than just a big piece of equipment. They became a treasured relic for a posse of involved artists and technicians. Such sound system posses regularly held battles against each other, to see who had the best records, mixing skills, or toasting talents. More often than not, these battles escalated in a hail of violence: imagine two neighborhood street parties of feuding families shooting at each other.<br><br>Another characteristic of all Jamaican music is a strong emphasis on the offbeat. This gives the music a laidback sound, ideal for warm outdoor weather and smoking marihuana. Indeed, cannabis – cultivated on Jamaica itself – is also partly responsible for the way most Jamaican music sounds, although its influence on the genre must not be exaggerated.<br><br>Besides all technical elements that define Jamaican music, there are other elements which have become a custom overseas, leading to Jamaican or Reggae subcultures in various other countries. Rastafarian colored artwork (red-yellow-green), similar fashion, or dreadlocks as a haircut for example. Dreadlocks were originally a Rastafarian symbol of spirituality, rebellion, individualism and proudness of race (as dreadlocks are something other races cannot so easily obtain). Jamaican music after all is more about non-conformity and originality than anything else. Jamaicans only play what they like. If it is not how they want it, they alter it. If it stops being made, they make it themselves. If it doesn’t exist, they invent it. Unfortunately, the island has ceased to produce any truly original genres since Ragga. Yet one would do well to keep a close eye on any music it brings forth.
    
- genre_id: "34.01"
  name: "Mento"
  year_emerged: 1951
  description: |
    All Jamaican music didn’t just appear out of thin air of course. A long and diverse culture of (European and African) <b>Folk</b> music already existed on the Island. This slowly led to the first real popular music genre: Mento. Mento was mostly <b>Calypso</b> (a Latin genre from Trinidad & Tobago) with <b>R&B influences</b>. Because Jamaica forms a junction between American, Latin and other music, Mento featured a whole <b>plethora of different instruments</b>, sounding more chaotic than harmonic. The most important thing however, were the unique lyrics; singers didn’t sing but spoke in a rhythmical and improvised way on top of the music, which was called “<b>Toasting</b>”. These “toasts” would much later be a major influence on Rap and Drum ‘n’ Bass. Mento can be regarded as a Folk music genre instead of a popular one, but being the pioneering Jamaican music genre, it makes sense to include it. Mento artists liked to think of themselves as a part of <b>aristocracy</b>, because the country was still a British colony in the fifties. This is shown in nobility titles such as Prince, Lord, Count, Duke, and King, which became a bit of a tradition in Jamaican music. After Mento, “<b>Bluebeat</b>”, a New Orleans based type of Rhythm ‘n’ Blues named after a record company, paves the way for Ska.
  artists: [ "Harry Belafonte", "Lord Lebby", "Lord Christo", "Lord Fly", "Lord Flea", "Lord Composer", "Louise Bennett", "Count Lasher", "Lauren Aitken"]

- genre_id: "34.02"
  name: "Original Ska"
  year_emerged: 1960
  description: |
    Ska really put the Jamaican music scene on the map. The nearest American city, New Orleans, brought its own version of <b>R&B (Bluebeat)</b> to the island where the sound was drastically changed. Sound effects like <b>echos</b> and advanced electronic instruments like <b>turntables and sound systems</b> (e.g. the famous Channel 1 and Cocksone Campbell systems) made this possible. The R&B rhythm of Bluebeat became accompanied by a<b> marching beat,</b> an influence from Rock 'n' Roll. Although there are (African) vocals, Ska (like a lot of Jamaican music) is more about the sound and feeling: <b>optimistic, serene and peaceful</b>. Blissful Jazzy riffs, <b>horns and staccato guitars</b> are the main tools to achieve this. Ska is also known for its <b>large brass orchestras</b> (10-20 people) dominating the music, whereas bass is rather simplistic with accent on the offbeat.<br><br>When Detroit Soul and Philly Soul started to <b>eclipse New Orleans Soul</b> (Southern Soul) and New Orleans Blues, Ska experienced a sharp rise, as the Jamaican public - fond of the <b>Crescent City’s music</b> - was forced to take matters in their own hands. This happens simultaneously with the <b>independence of Jamaica</b> in 1962, providing a tremendous opportunity to create a <b>unique and national sound</b> for a new country. Ska becomes a huge success, accompanied by its own jagged, hyperactive type of dancing: <b>Skank</b>. With two subsequent and important <b>ska-revivals</b> (abroad), skank also receives an overhaul and gets picked up later by Hardcore Punk & Jump Up. For the sake of clarity, this genre is therefore pinpointed as the <b>first wave of Ska</b> or <b>Jamaican Ska</b>
  artists: ["Desmond Dekker","Toots & The Maytals","Derrick Morgan","The Skatalites","Jimmy Cliff","Prince Buster","The Upsetters","Owen Gray","King Edwards"]
  
- genre_id: "34.03"
  name: "Roots Reggae"
  year_emerged: 1968
  description: |
    The optimism for new and better governance was quickly waning, when Jamaican citizens realized they were not better off with independence than with colonization. During its infancy as a state, Jamaica failed to address the needs of the poor, especially in urban <b>ghettos</b>. These places became the breeding ground for a new, <b>slower</b> type of Rocksteady: “Reggae”. Embedded in the s<b>unny, warm Caribbean climate</b> of Jamaica and influenced by the abundant availability of <b>marihuana</b>, Reggae doesn’t sound as much <b>reactionary</b> as it is. But to this very day it has never ceased to question authority. Reggae exploded in <b>1972</b>, thanks to both the <b>10 year anniversary</b> of the country (and thus a decade of failed politics) and the film release of “<b>The Harder They Come</b>”, which made Reggae popular overseas.<br><br>The <b>bass guitar</b> became Reggae’s leading instrument, which dropped the first beat of a bar, creating the so called “<b>one drop rhythm</b>” which gives Reggae its characteristic offbeat sound. The rhythm <b>staccato guitar</b> moved to the background, but other <b>Ska characteristics</b> were still clearly audible. This Early Reggae eventually got claimed as the subcultural music of the <b>spiritual Rastafari movement</b>. Rastafari is a special Jamaican faith dating back as early as the thirties, which deals about many issues that are also attributed to Reggae: religion, racism, ghetto-life, cannabis use, <b>African roots</b> and more. The term “<b>Roots Reggae</b>” is either reserved for Reggae strongly expressing Rastafari beliefs and issues, or to distinguish the genre from other Jamaican music.
  artists: ["Bob Marley & the Wailers","Burning Spear","Black Uhuru","Peter Tosh","Prince Far I","Max Romeo","Sylford Walker","Buju Banton","Don Carlos","Israel Vibration","Damian Marley","Clint Eastwood & General Saint"]
  
# - genre_id: "34.04"
#   name: "Dub"
#   year_emerged: 1970
#   description: |
#     The early Reggae composers probably never thought that Dub was going to be such an important and <b>influential</b> genre. Dub started out as <b>instrumental B-sides</b> or <b>copy records</b> of Reggae or Rocksteady records. Hence the word “dub” was derived from the name of a copy record: a <b>dubplate</b> (double plate). The original music is completely <b>stripped down</b> of all instruments and then <b>rebuilt</b> in the same way but entirely <b>electronically</b> and much, much <b>slower</b>. Dub features lots of <b>sound effects</b>, especially <b>echo and reverb</b>, and incredibly <b>heavy subsonic bass</b> designed to be played on typical Jamaican<b> sound systems</b> (which have massive bass woofers and air scoops to support Dub music). One of the main characteristics of Dub manipulation is <b>delay</b>, which is used on many different parts of the song and often in an extensive, panoramic manner. This gives Dub its typical “wah-wah” feeling where sounds seem to bounce back from the walls and never die. All these sound effects synergize well with cannabis, which strongly influenced Dub music (and continues to do so).<br><br>Because of its <b>pioneering technology</b> yet <b>dreamy and surreal sound</b>, Dub was an important inspiration for all kinds of music and remains a living stream in the contemporary world of popular music. In the nineties, Dub gets influenced by EDM instead of the other way around, and becomes the subgenre <b>Digidub</b> (digital Dub).
#   artists: ["King Tubby","Lee “Scratch” Perry","Mad Professor ","King Jammy","Jah Shaka","Augustus Pablo","Bunny Lee","Winston Riley","Scientist","Tommy McCook & the Agrovators"]
  
- genre_id: "34.05"
  name: "Reggaetón & Latin Rap"
  description: |
    Latin Rap, a mixture of <b>Gangsta</b> Rap and Latin music, proved to be a successful cocktail. The mix of exotic breakbeat rhythms (filled with <b>brass, congas or Latin instruments</b>) and <b>Spanish</b> rap lyrics created an almost unrivaled tropical atmosphere and attitude of ‘coolness’. Latin Rap was far from slow and laidback but rather <b>spicy and furious</b>, meant to be played at max volume while cruising through the favelas and Hispanic ghettos. Instead of adding Latin elements to Rap music (what happened in the US), artists in <b>Puerto Rico</b> added American Gangsta Rap to their native music (mainly <b>heavy Bomba and a bit of Plena</b>) creating a whole new genre: Reggaetón (which has nothing to do with Reggae, but did get influenced by Dancehall). The result was similar to Latin Rap, but the rhythm was entirely based on Bomba with no R&B samples whatsoever, and the lyrics were even more <b>explicit</b> than Latin Rap. Reggaeton is based on the Ragga <b>Dembow riddim</b>, which uses the snare of a drum machine. The genre eventually made a surprising transfer to the world of Electro House, leading to Moombahton.
  artists: ["Tégo Calderon","Daddy Yankee","Don Omar","Calle 13","Yandel","Wisin","Cypress Hill","Kid Frost","Juan Gotti","Chingo Bling"]
  
- genre_id: "34.06"
  name: "Afrobeats"
  description: |
    Afrobeats (often referred to as West African Pop or Afro-pop) is a vibrant, rhythm-driven global genre that originated in West Africa—primarily Nigeria and Ghana—in the late 2000s and 2010s.

    Genre Breakdown
    Note on naming: Afrobeats (with an "s") is distinct from Afrobeat (no "s"), the 1970s political funk-jazz fusion pioneered by Fela Kuti. While modern Afrobeats draws inspiration from Afrobeat, it is a contemporary umbrella term for modern West African pop.

    Key Musical Characteristics
    Complex Percussion: Driven by syncopated drum patterns, log drums, congas, and modern electronic 808s that invite immediate movement.
    Melodic Hooks & Vocals: Features laid-back, smooth vocal arrangements, catchy call-and-response chorale hooks, and dynamic cadences.
    Linguistic Fusion: Lyrics frequently blend English, Nigerian Pidgin, Yoruba, Igbo, French, or Akan (Twi).
    Cross-Genre Hybrids: Integrates elements of dancehall, Caribbean soca, American R&B, hip-hop, and South African Amapiano.
  artists: ["Burna Boy", "Wizkid", "Davido", "Rema", "Tems", "Ayra Starr", "Asake", "Fireboy DML", "Tiwa Savage"]
  
  
- genre_id: "34.07"
  name: "Rocksteady"
  description: |
    Right after the British Mersey Beat Revolution a small youth subculture, the mods, existed, that listened to their own type of mod Rock & Roll. Almost exactly the same happened in Jamaica after the Ska revolution: <b>young gangsters</b> and street kids (known as “<b>rude boys</b>”) changed the happy, uptempo Ska in something they could relate to: much <b>cooler, slower</b> music (influenced by Soul) with an <b>easy but powerful bass</b> and more Rock influences such as <b>electric guitars</b> (though sparse). This rude boy music became known as Rocksteady. And just as Punk, Rap or Mod, the lyrics were more often than not about<b> political issues</b>, although the music sounded nowhere near as rough, but was often performed in R&B-like <b>small harmony groups</b>. The reason for implementing political content and a <b>slower, laidback and more serious tempo </b>was a <b>slowly growing discontent</b> with the very first Jamaican government installed after the independence in 1962. Another reason for the slowing down of Jamaican music lay in the simple fact that many musicians just didn’t like to play Ska’s hyperactive rhythm. Particularly of notice for Rocksteady, is the famous Jamaican <b>Tuff Gong Records</b> label. Right before the rise of Reggae, Rocksteady led to a specific subgenre known as “<b>Poppa-Top</b>”, which had a looser and bubblier rhythm.
  artists:  ["Hopeton Lewis","The Heptones","The Paragons","Alton Ellis","Phillis Dillon","Slim Smith & the Uniques","Rita Marley","Stranger Cole","Ken Boothe ","The Melodians "]
  
- genre_id: "34.09"
  name: "Calypso & Soca"
  year_emerged: 1912
  description: |
    Originating in Trinidad and Tobago, Calypso evolved from African griot traditions and slave emancipation songs, characterized by witty social commentary and syncopated brass rhythms. In the 1970s, Lord Shorty fused Calypso with Indian rhythmic instruments (dholak, tabla) and American Soul/Funk to create "Soca" (Soul of Calypso)—a high-bpm, party-centric genre designed for Carnival.
  artists: ["Mighty Sparrow", "Lord Kitchener", "Calypso Rose", "Lord Shorty", "Machel Montano", "Destra Garcia", "Bunji Garlin"]

- genre_id: "34.10"
  name: "Zouk & Bouyon"
  year_emerged: 1979
  description: |
    Pioneered by the French Antillean band Kassav' in Guadeloupe and Martinique, Zouk revolutionized Caribbean pop by blending local Gwo Ka percussion with studio synthesizers, lush horn lines, and complex funk basslines. In Dominica, Zouk fused with local Kadans and Jing Ping traditions to yield high-energy Bouyon, which later influenced modern Afrobeats and Soca.
  artists: ["Kassav'", "Jocelyne Béroard", "Francky Vincent", "WCK (Windward Caribbean Kulture)", "Triple Kay"]

- genre_id: "34.11"
  name: "Traditional Cuban (Son & Rumba)"
  year_emerged: 1890
  description: |
    Cuban music serves as the primary bridge between West African clave rhythms and Western harmony. Afro-Cuban Rumba provided street-level percussion and vocal call-and-response, while Son Cubano merged Spanish classical guitar with African drums (bongo, marimbula). Son became the direct foundational blueprint for mid-20th century Salsa.
  artists: ["Buena Vista Social Club", "Compay Segundo", "Célia Cruz", "Arsenio Rodríguez", "Irakere", "Los Muñequitos de Matanzas"]
  



- genre_id: "40"
  name: "Rap & Hip-Hop"
  description: |
    Hip-Hop culture—encompassing MCing, DJing, breakdancing, and graffiti—originated in the South Bronx of New York City during the early 1970s. Emerging from neighborhood block parties powered by massive sound systems, the genre was built on the innovation of isolating and looping instrumental breakbeats from Funk, Disco, and Soul records. Over the decades, Hip-Hop evolved from a localized urban subculture into the dominant global force in popular music, redefining vocal delivery, music production, and street culture worldwide.<br><br>Musically, Rap is defined by rhythmic vocal delivery (rhyming and flow) laid over structured beats. The genre's evolution traces a continuous push-and-pull between party-oriented entertainment, fierce regional rivalries, raw social critique, and high-level studio production. From the sample-heavy boom-bap of the East Coast and the synthy, laid-back grooves of the West Coast to the sub-bass heavy strains of Southern Trap and UK Drill, Hip-Hop remains a versatile, constantly mutating movement.

- genre_id: "40.01"
  name: "Old School & Golden Age"
  year_emerged: 1974
  description: |
    The foundational era of Rap emerged from <b>South Bronx block parties</b> where early pioneers like DJ Kool Herc, Grandmaster Flash, and Afrika Bambaataa isolated <b>funk and disco breakbeats</b> using turntables and drum computers. Initially characterized by playful, party-rocking rhymes and <b>spontaneous MCing</b> over live-mixed instrumental loops, the music expanded dramatically in the mid-1980s. The <b>Golden Age</b> brought unprecedented technical refinement: MCs shifted to <b>eloquent flows</b>, complex internal rhyme schemes, and socio-political themes, while producers embraced <b>harder drum machines (TR-808)</b> and aggressive rock samples (championed by Run-D.M.C. and Def Jam), bringing Hip-Hop into mainstream global consciousness.
  artists: ["Grandmaster Flash & the Furious Five", "The Sugarhill Gang", "Run-D.M.C.", "Eric B. & Rakim", "Public Enemy", "LL Cool J", "Slick Rick", "Kurtis Blow", "EPMD", "Boogie Down Productions"]

- genre_id: "40.02"
  name: "East Coast & Hardcore"
  year_emerged: 1986
  description: |
    As Hip-Hop matured in its birthplace, East Coast rap developed a distinct, atmospheric identity centered around <b>grit, lyricism, and boom-bap drum patterns</b>. Pioneered in New York, the sound relies heavily on <b>jazz, soul, and dark piano samples</b> layered over crisp, swinging snares. Lyrically, East Coast MCs elevated the art of storytelling, detailing urban survival, complex street narratives, and <b>mafioso-inspired ambition</b>. Hardcore Rap emerged as an aggressive counterweight to radio pop, showcasing raw, unfiltered vocal delivery, dense wordplay, and intense posse cuts.
  artists: ["The Notorious B.I.G.", "Nas", "Wu-Tang Clan", "Jay-Z", "Mobb Deep", "50 Cent", "Big L", "DMX", "Big Pun", "Cam'ron"]

- genre_id: "40.03"
  name: "West Coast & G-Funk"
  year_emerged: 1987
  description: |
    Originating in Los Angeles and Compton, West Coast Rap introduced a stark, vivid portrayal of <b>ghetto realities, gang culture, and police tension</b>. After early Gangsta Rap pioneers set the tone with aggressive commentary, the sound revolutionized in the early 1990s through <b>G-Funk (Gangsta Funk)</b>. Masterminded by Dr. Dre and Death Row Records, G-Funk paired heavy <b>P-Funk samples</b> with high-pitched, whining <b>synth leads, deep Moog basslines</b>, and relaxed, melodic vocal deliveries. The result was a distinct sonic paradox: violent, explicit street tales delivered over warm, laid-back, sun-drenched grooves designed for car stereos.
  artists: ["N.W.A.", "Dr. Dre", "Snoop Dogg", "2Pac", "Ice Cube", "Warren G", "Eazy-E", "Tha Dogg Pound", "DJ Quik", "Cypress Hill"]

- genre_id: "40.04"
  name: "Southern Rap, Crunk & Bounce"
  year_emerged: 1986
  description: |
    Initially overlooked by the East/West coastal dominance, the American South forged a rich, highly diverse ecosystem of regional scenes spanning <b>Atlanta, Houston, Memphis, Miami, and New Orleans</b>. Southern Rap is united by a heavy emphasis on <b>booming sub-bass</b>, slower tempos, and an uninhibited club orientation. Key regional innovations include <b>Miami Bass</b> (fast, electro-heavy booty music), <b>New Orleans Bounce</b> (hyper-sexual, rapid-fire call-and-response over syncopated drum breaks), and <b>Crunk</b> (aggressive, synth-driven party anthems filled with shouted crowd vocals). The South's eclectic output laid the essential foundation for 21st-century rap dominance.
  artists: ["Outkast", "Geto Boys", "Goodie Mob", "Three 6 Mafia", "2 Live Crew", "Lil Jon & The East Side Boyz", "UGK", "Juvenile", "8Ball & MJG", "Ying Yang Twins"]

- genre_id: "40.05"
  name: "Conscious & Jazz Rap"
  year_emerged: 1989
  description: |
    Formed as an artistic counterweight to the profanity and aggression of early Gangsta Rap, Conscious and Jazz Rap prioritized <b>social awareness, afrocentric pride, philosophy, and musical experimentation</b>. Helmed by collectives like the <b>Native Tongues</b>, producers combined warm <b>double-basslines, soft horn charts, and vintage jazz/soul samples</b> with an easygoing, bohemian aesthetic. Lyrically, artists focused on systemic critique, personal reflection, spiritual growth, and abstract wordplay, earning a reputation as Hip-Hop's intellectual and alternative branch.
  artists: ["A Tribe Called Quest", "De La Soul", "Mos Def", "Talib Kweli", "Common", "The Roots", "Gang Starr", "Digable Planets", "Pharcyde", "Dead Prez"]

- genre_id: "40.06"
  name: "Modern, Trap & Drill"
  year_emerged: 2003
  description: |
    Emerging from Atlanta's underground drug trade locations ("trap houses"), <b>Trap</b> transformed rap into a fully digitized, synthesizer-driven genre. Defined by <b>rapid, rolling 808 hi-hats, heavy sub-bass kick drums, dark synth pads</b>, and frequent use of melodic <b>Auto-Tune</b>, Trap quickly became the default blueprint for modern global pop and hip-hop. The sound further mutated into <b>Drill</b> (originating in Chicago and refined in London and New York), characterized by even darker, nihilistic lyrical themes, sliding 808 basslines, and skittering, offbeat snare placements.
  artists: ["T.I.", "Gucci Mane", "Future", "Young Thug", "Travis Scott", "Chief Keef", "Pop Smoke", "Rick Ross", "Waka Flocka Flame", "Lil Baby"]

- genre_id: "40.07"
  name: "Pop Rap & R&B Crossovers"
  year_emerged: 1990
  description: |
    Pop Rap bridges the rhythmic drive and vocal delivery of Hip-Hop with the structure, polished production, and <b>sing-along choruses</b> of mainstream pop and contemporary R&B. Pioneered by early crossover acts and later refined by hitmaking producers in the 2000s, this style trades raw street themes for <b>melodic hooks, upbeat party vibes, dancefloor breakbeats</b>, and radio-friendly arrangements. It remains one of the most commercially lucrative sub-genres in modern entertainment.
  artists: ["Drake", "Nelly", "MC Hammer", "Will Smith", "Flo Rida", "Black Eyed Peas", "Pitbull", "Nicki Minaj", "Lizzo"]

- genre_id: "40.08"
  name: "UK Rap & Grime"
  year_emerged: 2001
  description: |
    Developed in East London, <b>Grime</b> and UK Rap represent the British adaptation of Hip-Hop, heavily infused with native UK sound-system culture including <b>2-Step Garage, Jungle, and Dancehall</b>. Operating at a fast-paced <b>140 BPM</b>, Grime features rapid, aggressive syncopated cadences over dark, lo-fi, <b>futuristic electronic beats</b> and heavy sawtooth basslines. Beyond Grime, the UK scene has fostered a massive ecosystem of road rap and UK Drill, making London one of the world's primary rap capitals.
  artists: ["Dizzee Rascal", "Wiley", "Skepta", "Stormzy", "Jme", "Giggs", "Kano", "Dave", "Little Simz", "AJ Tracey"]

- genre_id: "40.09"
  name: "Trip-Hop & Abstract Hip-Hop"
  year_emerged: 1992
  description: |
    Emerging simultaneously in Bristol, UK, and experimental US underground pockets, this sub-genre decelerates Hip-Hop breakbeats into <b>downtempo, atmospheric, and melancholic soundscapes</b>. Blending Hip-Hop production techniques with <b>dub, psychedelia, jazz, and ambient electronics</b>, Trip-Hop and Abstract Rap focus on mood, texture, and non-traditional song structures, often featuring cinematic orchestration, surreal samples, and dense, stream-of-consciousness poetry.
  artists: ["DJ Shadow", "Massive Attack", "Portishead", "MF DOOM", "Cannibal Ox", "Company Flow", "Tricky", "El-P", "Madlib"]


- genre_id: "50"
  name: "Electronic/Club"
     
- genre_id: "50.01"
  name: "Techno"
  description: |
    Where House looks back toward disco and soul, Techno looks forward toward industrialism, science fiction, and pure synth experimentation. It uses a prominent four-on-the-floor kick, but the percussion is typically punchier, harder, and metallic. Techno is less about melody or song structures and more about texture, repetition, and micro-changes over time to lock listeners into a trance-like state on the dance floor.  Key sound indicators: Metallic percussion, dark sub-bass, synthetic noise, mechanical stabs, and minimal or non-existent vocal melodies.
  artists: ["The Belleville Three (Juan Atkins, Derrick May, Kevin Saunderson", "Jeff Mills", "Carl Cox"]

  
- genre_id: "50.04"
  name: "House" 
  description: |
    House music evolved from disco and funk. It relies on a steady "four-on-the-floor" beat (a kick drum on every beat) paired with an off-beat hi-hat (unss-unss-unss-unss). House is defined by its soul—it frequently features funky basslines, piano chords, gospel-inspired vocal hooks, and a strong emphasis on the "groove" or swing.  Key sound indicators: Warm basslines, disco samples, piano stabs, soulful vocals, and a rhythm designed to keep people moving continuously.

  artists: ["Frankie Knuckles", "Larry Heard (Mr. Fingers)", "Daft Punk"]
  
- genre_id: "50.02"
  name: "Trance"
  description: |
    Trance takes the hypnotic rhythm of techno and injects it with grand, emotional melodies. A classic Trance track is built around a journey: long tension-building sections leading up to a dramatic breakdown (where the kick drum drops out completely and soaring synth leads sweep in), followed by a massive, high-energy drop.  Key sound indicators: Arpeggiated synth leads, sweeping filter pads, dramatic build-ups and drops, and major-key emotional melodies.
  artists: ["Paul van Dyk", "Armin van Buuren", "Above & Beyond"]
  
- genre_id: "50.03"
  name: "Downtempo" 
  description: |
    Unlike the other three, Downtempo isn't designed for high-energy peak-hour dance floors. It was born in club "chillout rooms" where dancers went to cool off. Rhythmically, it rarely uses a rigid four-on-the-floor pattern—instead opting for slower breakbeats, hip-hop-style drums, or syncopated percussion. It borrows heavily from ambient, dub, jazz, and trip-hop.  Key sound indicators: Slow tempos, deep ambient atmospheres, relaxed beat patterns, warm acoustic or electronic textures, and a head-nodding feel.
  artists: ["Massive Attack", "Portishead", "Bonobo"]
  
  
- genre_id: "60"
  name: "Folk Traditions"
  description: |
    Traditional and regional folk music styles anchored in local heritage, community oral history, and indigenous or immigrant roots[cite: 1]. These styles rely heavily on acoustic, highly portable instrumentation—such as fiddles, accordions, pipes, and frame drums—designed for community gatherings, barn dances, pub sessions, and storytelling[cite: 1]. Unlike commercial pop genres, Folk Traditions prioritize cultural preservation, distinct regional dialects or modal tunings, and dance rhythms handed down through generations[cite: 1].

- genre_id: "60.01"
  name: "Celtic"
  year_emerged: 1600
  description: |
    Celtic folk encompasses the traditional music of the Celtic nations—most notably Ireland, Scotland, Wales, Brittany, and Galicia[cite: 1]. Built on lively dance meters (jigs, reels, hornpipes) and haunting slow airs, it utilizes modal scales and traditional instruments like the uilleann pipes, tin whistle, fiddle, bodhrán frame drum, and Celtic harp[cite: 1]. The genre experienced a massive global resurgence in the 20th century through pub session culture and ensemble revivals, eventually expanding into contemporary Celtic rock and fusion[cite: 1].
  artists: ["The Chieftains", "The Dubliners", "Altan", "Planxty", "Clannad", "Silas & The Blacksmiths", "Lunasa", "Capercaillie", "The Bothy Band"]

- genre_id: "60.03"
  name: "Appalachian"
  year_emerged: 1800
  description: |
    Developed in the isolation of the Appalachian Mountains, this tradition formed as European immigrant balladry (English, Scottish, Irish) collided with African-American rhythmic traditions and instruments[cite: 1]. Driven primarily by clawhammer banjo, acoustic guitar, and rhythmic fiddle play (Old-Time music), Appalachian music focuses on high-lonesome vocal harmonies, sacred harp hymns, and square-dance tunes[cite: 1]. It serves as the direct historical ancestor to Bluegrass, Classic Country, and Modern Americana[cite: 1].
  artists: ["Clarence Ashley", "Bascom Lamar Lunsford", "The Carter Family", "Roscoe Holcomb", "Doc Watson", "Ola Belle Reed", "Tommy Jarrell", "The Highwoods Stringband"]

- genre_id: "60.04"
  name: "Cajun & Zydeco"
  year_emerged: 1920
  description: |
    Emerging from the bayous and prairies of Southwest Louisiana, these sibling genres share a foundation in French-language lyrics and dancehall culture[cite: 1]. Cajun music was developed by Acadian (French-Canadian) settlers, leaning on acoustic fiddle, diatonic button accordion, and triangle ("ti-fer")[cite: 1]. Zydeco grew alongside Cajun music in French-speaking Afro-Creole communities, infusing Louisiana Cajun roots with Blues, R&B, and syncopated washboard (rubboard or "frottoir") rhythms to create a fast, driving, highly danceable sound[cite: 1].
  artists: ["Clifton Chenier", "Dewey Balfa", "BeauSoleil", "Buckwheat Zydeco", "Stanley \"Buckwheat\" Dural Jr.", "Iry LeJeune", "Boozoo Chavis", "Steve Riley & The Mamou Playboys", "Rockin' Dopsie"]

- genre_id: "60.05"
  name: "Traditional Thai"
  year_emerged: 1238
  description: |
    Rooted in the court traditions and rural village life of Southeast Asia, traditional Thai music is defined by complex polyphonic stratification, non-tempered tuning, and a lack of harmony in the Western sense. Instead, ensembles build textures through simultaneous variations of a single melody across different instrumental registers. The music is divided into three primary ensemble styles: Piphat (percussion-heavy, featuring xylophone-like ranat and oboe-like pi, historically played for royal ceremonies and shadow puppet theater), Khruang Sai (string-dominated ensembles featuring saw bowed lutes and plucked zithers), and Mahori (a delicate fusion of both, featuring female vocalists). In northeastern Thailand (Isan), regional traditions like Mor Lam and Kantrum rely on the molam singer accompanied by the khaen (a bamboo mouth organ), delivering rapid, syncopated storytelling tunes.
  artists: ["Luang Pradit Phairao", "Waiphot Phetsuphan", "Sorasen", "Phatthaya Choem-phaet", "Banyen Rakkaen", "Ken Dalao", "Thepphabut Satiat"]
  
